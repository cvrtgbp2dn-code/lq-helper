<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拉群小助手 · 私域拉群进度管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    /* 参考 DeepSeek 开放平台的配色：侧栏浅灰 / 主区白 / 卡片浅灰 / 表头再深一档 */
    --bg: #ffffff;        /* 主区背景 */
    --side: #f9fafb;      /* 侧栏底：极浅灰 */
    --card: #f7f8fa;      /* 卡片底：浅灰 */
    --thead: #eef0f3;     /* 表头：比卡片稍深的灰 */
    --hover: #eceef1;     /* 悬停 / 侧栏激活块 */
    --line: #e6e8ec;      /* 边框 / 网格线 */
    --text: #1f2733;
    --muted: #8a94a6; --brand: #3b6ef0; --brand-d: #2f5bd0;
    --orange: #e8890c; --orange-bg: #fdf3e3; --green: #1d9e6c; --green-bg: #e5f6ef;
    --gray-bg: #eceef1; --red: #d9534f; --red-bg: #fdeceb;
  }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* 布局：整页只有两块 —— 左侧栏 + 右主区。
     原来的顶栏和工具栏已取消：标题进了侧栏顶部，全局操作进了侧栏底部，搜索进了操作栏。 */
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--text); transition: .15s; }
  .btn:hover { border-color: var(--brand); color: var(--brand); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-d); }
  .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.red:hover { filter: brightness(.93); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  /* 侧栏底部那三个全局操作：通栏、左对齐、平时无底无框，悬停才浮出灰底 */
  .side-act { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none; border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit; color: var(--text); cursor: pointer; text-align: left; transition: .15s; }
  .side-act:hover { background: var(--hover); }
  /* ⚠️ 图标配色规则（全侧栏统一）：
     平时一律灰（--muted）；**只有激活时才上色**，颜色取该项自己的 --ac（由 JS 内联给）。
     悬停时也上一点色 = "点下去会变成这样"的预览。 */
  .side-act svg { flex-shrink: 0; color: var(--muted); transition: color .15s; }
  .side-act:hover svg { color: var(--ac, var(--brand)); }
  .side-act.active { background: var(--hover); }
  .side-act.active svg { color: var(--ac, var(--brand)); }
  .side-act.active span:not(.dt-caret) { font-weight: 600; }

  .layout { display: flex; align-items: flex-start; }
  /* 侧栏：浅灰底 + 右边一条分隔线，高度锁死一屏。
     内部三段式 —— 标题（固定）/ 设备列表（撑满、自己滚）/ 底部全局操作（固定）。
     因为整页没有顶栏了，sticky top 就是 0。 */
  .sidebar { width: 232px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow: hidden;
             background: var(--side); border-right: 1px solid var(--line);
             display: flex; flex-direction: column; padding: 16px 12px 12px; }
  .side-head { padding: 0 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 10px; text-align: center; }
  .side-head h1 { font-size: 16px; font-weight: 700; letter-spacing: .3px; text-align: center; }
  .side-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 2px; }
  .side-foot { padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--line); }
  /* 仪表盘下面那条细分隔线 */
  .side-hr { height: 1px; background: var(--line); margin: 8px 6px 10px; }

  .dev-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-bottom: 2px; }
  .dev-item:hover { background: var(--hover); }
  /* 激活项：灰底块 + 文字加粗；图标平时灰，激活时用**这台设备自己的**柔和色 */
  .dev-item.active { background: var(--hover); font-weight: 600; }
  .dev-item.active svg { color: var(--ac, var(--brand)); }
  .dev-item svg { flex-shrink: 0; color: var(--muted); transition: color .15s; }
  .dev-item:hover svg { color: var(--ac, var(--brand)); }
  .dev-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-item .cnt { font-size: 12px; color: var(--muted); background: var(--gray-bg); border-radius: 10px; padding: 1px 8px; flex-shrink: 0; }
  .dev-item.active .cnt { background: #fff; color: var(--brand-d); }
  /* 「设备列表」分组头：与底部「导入/导出/库管理」同一套线性图标语言。
     展开（激活）时图标变蓝，收起时灰色；右侧一个 ▾/▸ 表示可折叠。 */
  .side-title { display: flex; align-items: center; gap: 10px; width: 100%; border: none; background: none;
                border-radius: 8px; padding: 9px 10px; font-size: 14px; font-family: inherit; color: var(--text);
                cursor: pointer; text-align: left; transition: .15s; user-select: none; margin-bottom: 2px; }
  .side-title:hover { background: var(--hover); }
  .side-title svg { flex-shrink: 0; color: var(--muted); }
  .side-title.open svg { color: var(--muted); }
  .side-title .dt-caret { margin-left: auto; font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .dev-list-body[hidden] { display: none; }
  .side-add { margin: 6px 0 0; width: 100%; border: 1px dashed var(--line); background: none; border-radius: 8px; padding: 8px; font-size: 13px; font-family: inherit; color: var(--muted); cursor: pointer;
              display: flex; align-items: center; justify-content: center; gap: 6px; transition: .15s; }
  .side-add svg { flex-shrink: 0; transition: color .15s; }
  .side-add:hover { border-color: var(--ac, var(--brand)); color: var(--ac, var(--brand)); }
  .side-add:hover svg { color: var(--ac, var(--brand)); }
  .side-add.active { border-color: var(--ac, var(--brand)); color: var(--ac, var(--brand)); }
  .side-add.active svg { color: var(--ac, var(--brand)); }

  /* 主区不封顶，完全跟着窗口走（1920 屏上卡片约 1650px）。
     列宽是百分比，窗口越宽列越宽；窗口收窄时会一并等比收窄。 */
  main { flex: 1; padding: 16px 20px 24px; min-width: 0; }

  /* 操作栏：左边是设备名 / 提示，右边是一整列（操作 → 统计 → 搜索），整列靠最右 */
  /* 操作栏：单行卡片 —— 左边「已选N + 选中未分配 + 群名输入框 + 确认 + 取消」，右边统计（最右端）。
     位置在卡片**下方**，并且吸在窗口底部（bottom: 12px）——往下滚时它一直停在底部上方 12px，
     滚到页面尽头自然落回原位。只在数据视图存在，所以「只在单设备吸底」是自动满足的。 */
  .view-bar { display: flex; flex-direction: column; gap: 10px; background: var(--card); border: 1px solid var(--line);
              border-radius: 12px; padding: 12px 16px; margin-top: 14px;
              position: sticky; bottom: 12px; z-index: 30; box-shadow: 0 6px 18px rgba(31,39,51,.08); }
  .view-bar .vb-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .view-bar .vb-sel { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .view-bar .vb-sel b { color: var(--brand); font-size: 17px; margin: 0 2px; }
  /* 群名输入框 */
  .view-bar .vb-input { width: 176px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 14px; font-family: inherit; outline: none; background: #fff; }
  .view-bar .vb-input:focus { border-color: var(--brand); }
  /* 注：群名框右边原来那两个「✓ 确认 / ✕ 取消」图标按钮已按用户要求去掉（改成回车执行），
     所以 .vb-icon 那一整套样式也一并删掉了。 */
  /* 「选中未分配」：小号（32px），图标 + 小字，和整条操作栏同一套圆角/描边 */
  .view-bar .vb-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; flex-shrink: 0;
                      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
                      font-size: 13px; font-family: inherit; white-space: nowrap; cursor: pointer; transition: .15s; }
  .view-bar .vb-btn svg { color: var(--muted); }
  .view-bar .vb-btn:hover { border-color: var(--brand); color: var(--brand); }
  .view-bar .vb-btn:hover svg { color: var(--brand); }
  /* 激活态：只有按钮变蓝，数据行不做任何高亮 */
  .view-bar .vb-btn.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .view-bar .vb-btn.on svg { color: #fff; }
  .view-bar .vb-btn.on:hover { background: var(--brand-d); border-color: var(--brand-d); }
  /* 统计靠右：空白留给「搜索框」，让它紧贴统计左边（见 .vb-loc 的 margin-left:auto）。
     ⚠️ 这里 margin 必须是 0 —— .vb-row 本身有 10px 的 flex gap，再加 margin 会叠成 22px，
        看起来就不"贴着"了（踩过）。 */
  .vb-stats-right { margin-left: 0; align-self: center; }

  /* ---------- 搜索定位框（在 ✕ 和统计之间那块空隙里）----------
     用途只有「找人在哪」：表格内容、勾选、统计都**完全不动**。
     flex: 1 让它自动吃掉 ✕ 和统计之间的空白，窄屏自动收窄。 */
  .view-bar .vb-loc { position: relative; display: inline-flex; align-items: center;
                      flex: 0 0 220px; margin-left: auto; }   /* 固定 220px + 靠右贴统计 */
  .view-bar .vb-loc .loc-ico { position: absolute; left: 10px; display: inline-flex; color: var(--muted); pointer-events: none; }
  .view-bar .loc-inp { width: 100%; border: 1px solid var(--line); border-radius: 8px;
                       padding: 8px 12px 8px 32px; font-size: 13px; font-family: inherit;
                       outline: none; background: #fff; }
  .view-bar .loc-inp:focus { border-color: var(--brand); }
  .view-bar .loc-inp::placeholder { color: #b7bec9; }
  /* 下拉列表：**向上弹** —— 操作栏吸在窗口最底下，往下弹会被挡在外面 */
  .view-bar .loc-list { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 40;
                        background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
                        box-shadow: 0 8px 24px rgba(31, 39, 51, .16); }
  .view-bar .loc-list[hidden] { display: none; }
  .view-bar .loc-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px;
                        cursor: pointer; font-size: 13px; transition: background .12s; }
  .view-bar .loc-item + .loc-item { border-top: 1px solid #f2f4f7; }
  .view-bar .loc-item:hover, .view-bar .loc-item.active { background: #eef3ff; }
  .view-bar .loc-nick { font-weight: 600; flex-shrink: 0; max-width: 104px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view-bar .loc-id { flex: 1; min-width: 0; color: var(--muted); font-size: 12px;
                      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .view-bar .loc-none { padding: 10px 12px; color: var(--muted); font-size: 12.5px; }
  /* 跳转后高亮那一行（用 !important 盖住 row-done 的底色），3 秒后淡出 */
  tr.loc-hit > td { background: #d9e6ff !important; transition: background .5s; }

  /* 统计（总人数/本组人数 · 不在库 · 已分配 · 群组），配色与各处保持一致 */
  .vb-stats { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .vb-stats .sep { color: #ccd3dd; }
  .vb-stats b { font-weight: 700; color: var(--text); }
  .vb-stats .v-ool b { color: var(--red); }
  .vb-stats .v-pending b { color: var(--orange); }
  .vb-stats .v-group b { color: var(--brand-d); }

  .group-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }

  /* 固定列宽模式：列宽只由表头那行的百分比决定，跟单元格内容完全无关。
     好处有三：① 长昵称/长群名再也不会把整列撑开、挤扁其他列；
     ② 双击编辑时列宽数学上不可能变化（此前两次「宽距来回动」都是自动布局引起的）；
     ③ 窄窗口下不会横向溢出。 */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* 完整网格线：每格都有下边框 + 右边框。
     最后一列不画右边框 —— 它会和卡片自身的边框贴在一起叠成一条双线。 */
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
  th:last-child, td:last-child { border-right: none; }
  /* 超长文字就地省略号收尾 —— 只是「显示」被截短，DOM 里仍是完整内容：
     悬停看 title、双击编辑看全名、框选复制粘贴拿到的也是全名。 */
  th, td { overflow: hidden; text-overflow: ellipsis; }
  /* 表头一层浅底（与卡片头同色），有了网格线之后更容易一眼分清表头和数据 */
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--thead); }
  /* 昵称/群名称列：宽度由表头的百分比锁定，超长内容由上面的省略号规则收尾。
     千万不要再往 td.nick 或它的子元素上加 max-width —— 自动布局下它不生效，
     固定布局下更是多余，只会在进入编辑态时引起列宽跳动。 */
  td.nick { white-space: nowrap; }
  td.groupname { font-weight: 600; color: var(--brand-d); }
  tr:hover td { background: #f7f9fd; }
  tr.row-done td { color: var(--muted); background: #fbfdfb; }
  td.date { color: var(--muted); }
  td[data-field] { cursor: text; }
  td[data-field]:hover { background: #eef3ff; }
  /* 编辑态：单元格内边距归零，让输入框原样铺满整格（尺寸与文字位置都不动，内边距由输入框自己承担） */
  td.editing { padding: 0; }
  .cell-edit { display: block; box-sizing: border-box; width: 100%; height: 100%; min-width: 0; font: inherit; font-size: 14px; border: none; border-radius: 0; padding: 10px 12px; outline: 2px solid var(--brand); outline-offset: -2px; background: #fff; }

  .badge { display: inline-block; font-size: 12px; border-radius: 10px; padding: 2px 10px; }
  .badge.none { background: var(--gray-bg); color: var(--muted); }
  .badge.pending { background: var(--orange-bg); color: var(--orange); }
  .badge.done { background: var(--green-bg); color: var(--green); }
  /* 「不在库」：数据ID 不在名单库里时叠加显示。判定是实时算的，不写进数据 —— 名单库更新后旧数据会自动跟着变。
     只在「未分配」的行上出现（已进入流程的行不再判库）。 */
  .badge.outlib { background: var(--red-bg); color: var(--red); }

  /* 行尾删除列：垃圾桶图标，平时灰色，悬停变红。
     勾选列 / 删除列只放一个小图标，内边距收窄，避免被省略号补「…」。 */
  /* 勾选列 / 删除列：内边距收窄 + 内容居中，避免复选框贴左、或被省略号补「…」。 */
  th.chk, td.chk, th.col-del, td.col-del { padding-left: 4px; padding-right: 4px; text-align: center; }
  .col-del { text-align: center; }
  .row-del { border: none; background: none; cursor: pointer; color: var(--muted); padding: 3px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; transition: .15s; }
  .row-del:hover { color: var(--red); background: var(--red-bg); }
  th.col-del .row-del { color: var(--muted); }

  .done-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; padding-right: 10px; }
  .done-toggle { flex: 1; display: block; text-align: left; border: none; background: none; padding: 8px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .done-toggle:hover { color: var(--brand); }
  .done-act { border: none; background: none; cursor: pointer; font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .done-act:hover { background: #e7ecf5; color: var(--brand); }
  .done-act.del:hover { color: var(--red); background: #fdeceb; }
  /* 「恢复」按钮（垃圾桶左边）：hover 走绿色，和「删除」的红色区分开 */
  .done-act.undo:hover { color: var(--green); background: #e5f6ef; }
  tr.done-divider td { padding: 0; }
  .done-wrap.collapsed { display: none; }

  .empty { text-align: center; color: var(--muted); padding: 70px 0; }
  .empty .big { font-size: 44px; margin-bottom: 12px; }
  .empty-group { padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }

  /* 自定义弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(20,28,42,.42); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
  .modal-mask.show { display: flex; }
  .modal-card { background: #fff; border-radius: 14px; width: 100%; max-width: 440px; box-shadow: 0 18px 50px rgba(20,30,50,.28); overflow: hidden; }
  .modal-head { padding: 18px 22px 0; font-size: 16px; font-weight: 700; }
  .modal-body { padding: 12px 22px 4px; font-size: 14px; color: var(--text); line-height: 1.75; }
  .modal-body .muted { color: var(--muted); font-size: 13px; }
  .modal-body b.n { color: var(--brand); font-weight: 700; }
  .modal-input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none; margin-top: 10px; }
  .modal-input:focus { border-color: var(--brand); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 22px; }
  .dropzone { border: 1.5px dashed var(--line); border-radius: 12px; padding: 30px 16px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; background: #fafbfe; }
  .dropzone:hover { border-color: var(--brand); color: var(--brand); }
  .dropzone.over { border-color: var(--brand); background: #eef3ff; color: var(--brand); }
  .dropzone .dz-big { font-size: 32px; display: block; margin-bottom: 10px; }
  .dropzone .dz-sub { font-size: 12px; margin-top: 6px; }
  /* 导入页：待导入文件列表（可逐个 × 掉）+ 确定/取消 */
  .imp-list { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
  .imp-item { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line);
              border-radius: 8px; padding: 9px 12px; font-size: 13px; }
  .imp-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-item .sz { flex-shrink: 0; color: var(--muted); font-size: 12px; }
  .imp-item .imp-x { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
                     padding: 0; flex-shrink: 0; border: none; background: none; border-radius: 6px;
                     color: var(--muted); cursor: pointer; transition: .15s; }
  .imp-item .imp-x:hover { background: var(--gray-bg); color: var(--red); }
  .imp-item .imp-x svg { width: 14px; height: 14px; }
  .imp-acts { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .imp-acts.muted { color: var(--muted); font-size: 13px; }

  /* 提示条：带「撤销」按钮时横排显示。
     整条始终 pointer-events:none —— 绝不挡住底下的工具栏按钮；
     只有「撤销」按钮自己打开 auto，所以点得到。
     悬停暂停倒计时改用全局 mousemove 判断指针是否落在提示条矩形内（见 bindToastHover），
     这样既能暂停，又不会拦截点击。 */
  .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: #232a36; color: #fff; padding: 10px 22px; border-radius: 8px; font-size: 13px; z-index: 100; opacity: 0; transition: opacity .25s; pointer-events: none; display: flex; align-items: center; gap: 16px; max-width: calc(100vw - 40px); }
  .toast.show { opacity: 1; }
  .toast #toastMsg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast-act { pointer-events: auto; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .14); color: #fff; font: inherit; font-size: 13px; padding: 4px 14px; border-radius: 6px; cursor: pointer; }
  .toast-act:hover { background: rgba(255, 255, 255, .3); }
  .toast-act[hidden] { display: none; }

  /* 「库管理」弹窗里的三个来源选项 */
  .rs-opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; transition: .15s; }
  .rs-opt:last-child { margin-bottom: 0; }
  .rs-opt:hover { border-color: #c9d6f0; background: #fafbfe; }
  .rs-opt.on { border-color: var(--brand); background: #f4f7ff; }
  .rs-radio { flex-shrink: 0; width: 16px; height: 16px; border: 1.5px solid #c2cbdb; border-radius: 50%; margin-top: 2px; position: relative; box-sizing: border-box; }
  .rs-opt.on .rs-radio { border-color: var(--brand); }
  .rs-opt.on .rs-radio::after { content: ""; position: absolute; left: 3px; top: 3px; right: 3px; bottom: 3px; border-radius: 50%; background: var(--brand); }
  .rs-opt b { font-size: 14px; font-weight: 600; }
  .rs-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
  .rs-btns { margin-top: 9px; display: flex; gap: 8px; }
  .rs-btns .btn { padding: 5px 12px; font-size: 12px; }
  input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--brand); }

  /* 主区整页视图（导入 / 导出 / 库管理）：替代原来的居中小弹窗。
     点侧栏按钮时，主区从数据表切换成下面这一整张卡片，左上角有「返回」。 */
  /* 主区整页视图（导入 / 导出 / 库管理 / 管理设备）：不再铺满主区，
     而是一张居中的、宽度适中的卡片。 */
  /* 整页视图（导入/导出/数据库/管理设备/新增设备）：卡片在可用区域里**垂直居中** */
  .page-wrap { max-width: 620px; margin: 0 auto; min-height: calc(100vh - 40px); display: flex; align-items: center; }
  .page-card { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .page-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--thead); }
  .page-title { font-weight: 700; font-size: 15px; color: var(--text); }
  .page-body { padding: 24px 20px; }
  .page-body p { line-height: 1.9; }
  .page-body .muted { color: var(--muted); font-size: 13px; }
  .page-body b.n { color: var(--brand); font-weight: 700; }
  /* 带图标的按钮（数据备份页用） */
  .page-body .btn-ico { display: inline-flex; align-items: center; gap: 7px; }
  .page-body .bk-sep { margin: 22px 0 16px; border-top: 1px dashed var(--line); }

  /* ==========================================================================
     仪表盘（2026-10-12 定稿版：大搜索框 + 统计栏）
     设计要点：**大而安静**
       · 搜索框只有一条底线（不是"白底+边框+圆角块"那种烂大街写法），聚焦时底线从左到右亮起
       · 统计数字浮动排布，**不用方块卡片**（方块 KPI 卡是"模板感"的主要来源）
       · 整页垂直居中偏上、大留白 —— 空 = 贵
     ========================================================================== */
  /* 用固定 vh 上边距，而不是 flex 垂直居中 —— flex 居中在这套布局里算出来的位置总偏高 ✗ */
  .dash2 { padding: 17vh 40px 60px; }
  .dash2 .inner { width: 100%; max-width: 760px; margin: 0 auto; }

  /* ---- 大搜索框 ---- */
  .big-search { position: relative; padding-bottom: 15px; }
  .big-search .row { display: flex; align-items: center; gap: 15px; }
  .big-search .bs-ico { display: inline-flex; flex-shrink: 0; color: #b7bec9; transition: color .2s; }
  .big-search:focus-within .bs-ico { color: var(--brand); }
  .big-search .bs-inp { flex: 1; min-width: 0; border: none; outline: none; background: none;
                        font-size: 19px; font-family: inherit; color: var(--text); padding: 4px 0; }
  .big-search .bs-inp::placeholder { color: #bcc3ce; }
  /* 底线：平时细灰；聚焦时叠一层品牌色渐变，从左往右铺开 */
  .big-search .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: #e6e9ee; }
  .big-search .bar::after { content: ''; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left;
                            background: linear-gradient(90deg, var(--brand), #7ea8ff);
                            transition: transform .38s cubic-bezier(.4, 0, .2, 1); }
  .big-search:focus-within .bar::after { transform: scaleX(1); }
  /* 结果列表：往下弹（仪表盘空间大，不需要像操作栏那样向上弹） */
  .bs-list { position: absolute; top: 100%; left: 0; right: 0; margin-top: 12px; z-index: 30;
             background: #fff; border: 1px solid var(--line); border-radius: 11px; overflow: hidden;
             box-shadow: 0 14px 40px rgba(31, 39, 51, .11); }
  .bs-list[hidden] { display: none; }
  .bs-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; font-size: 14.5px; transition: background .12s; }
  .bs-item + .bs-item { border-top: 1px solid #f2f4f7; }
  .bs-item:hover, .bs-item.active { background: #f4f7ff; }
  .bs-item .bn { font-weight: 600; flex-shrink: 0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bs-item .bi { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bs-none { padding: 13px 16px; color: var(--muted); font-size: 13px; }

  /* ---- 统计栏（5 个数字，靠留白分开，不用方块卡片）----
     ⚠️ 用 grid 五等分（宽度和上面的大搜索框**完全对齐**）——
        用 space-between 会两头差太远、用固定 gap 又会比搜索框窄一截，都不对 ✗ */
  .dash-stats { display: grid; grid-template-columns: repeat(5, 1fr); margin-top: 54px; }
  .dstat { position: relative; text-align: center; }
  .dstat .dv { font-size: 23px; font-weight: 700; letter-spacing: -.4px; line-height: 1.2;
               font-variant-numeric: tabular-nums; transition: color .16s; }
  .dstat .dl { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: .2px; white-space: nowrap; }
  /* 悬停时给标签加个点状下划线 —— 暗示"这里有东西"，但不暗示可点击 */
  .dstat:hover .dl { color: #7d8797; text-decoration: underline dotted #c8cfd8; text-underline-offset: 3px; }
  .dstat.s-total  .dv { color: var(--text); }
  .dstat.s-ool    .dv { color: var(--red); }
  .dstat.s-ool.zero .dv { color: #aab2be; }
  .dstat.s-pend   .dv { color: var(--orange); }
  .dstat.s-gpend  .dv { color: var(--brand); }
  .dstat.s-gdone  .dv { color: #9aa4b2; }
  /* 悬停浮出的小卡片：**向下弹** —— 统计栏下面是空的，向上会挡住大搜索框 ✗ */
  .dstat .pop { position: absolute; left: 50%; top: calc(100% + 13px);
                transform: translateX(-50%) translateY(-5px);
                background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 11px;
                box-shadow: 0 10px 30px rgba(31, 39, 51, .13); white-space: nowrap;
                opacity: 0; visibility: hidden; transition: .17s ease; z-index: 20; pointer-events: none; }
  .dstat:hover .pop { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
  .dstat .pop .pr { display: flex; align-items: center; gap: 18px; font-size: 12.5px; line-height: 1.95; }
  .dstat .pop .pr span { color: var(--muted); }
  .dstat .pop .pr b { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
  /* 群组卡片是「群名 + 设备名」两列 —— 群名正常色，设备名灰色且不加粗 */
  .dstat .pop .pr .gn { color: var(--text); font-weight: 600; max-width: 132px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dstat .pop .pr .gd { font-weight: 400; color: var(--muted); max-width: 150px;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dstat .pop .pnote { margin-top: 6px; padding-top: 6px; border-top: 1px solid #f2f4f7;
                       font-size: 11px; color: #aab2be; }
  /* 跳转后高亮那一行 */
  tr.loc-hit > td { background: #d9e6ff !important; transition: background .5s; }

  @media (max-width: 900px) { .dash-stats { flex-wrap: wrap; gap: 22px 0; } .dstat { width: 33.33%; } }
  .page-body .rs-opt { background: #fff; }
  /* 管理设备：每行一个设备 + 拖拽手柄 + 改名/删除（排序靠拖拽，不再用上下箭头） */
  .mg-row { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
  .mg-row[draggable="true"] { cursor: grab; }
  .mg-row.dragging { opacity: .4; }
  .mg-row.drag-over { box-shadow: inset 0 2px 0 var(--brand); }
  .mg-grip { flex-shrink: 0; display: flex; color: var(--muted); cursor: grab; }
  .mg-grip:hover { color: var(--brand); }
  .mg-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .mg-row .cnt { font-size: 12px; color: var(--muted); background: var(--gray-bg); border-radius: 10px; padding: 1px 8px; flex-shrink: 0; }
  .mg-row .btn { padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body>

<!-- 隐藏的文件选择框：必须放在静态位置。
     侧栏和主区都会随列表重绘，放里面的话重绘后监听就失效了。 -->
<input type="file" id="fileInput" accept=".xls,.html,.htm,.csv,.txt" multiple hidden>
<input type="file" id="rosterFile" accept=".csv,.txt" hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<!-- 自定义弹窗（导出/删除/导入/新增设备共用） -->
<div class="modal-mask" id="modalMask">
  <div class="modal-card">
    <div class="modal-head" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button class="toast-act" id="toastUndo" hidden>撤销</button></div>

<script>
(function () {
  'use strict';
  var LS_KEY = 'lq_helper_rows_v2';
  var LS_DEV = 'lq_helper_dev_order_v2';
  var LS_MAN = 'lq_helper_dev_manual_v2';
  var LS_UI  = 'lq_helper_ui_v2';

  /** 数据行: {k, id, nick, device, dtype, date, group, status} status: none|pending|done
   *  k = 行内部唯一键（稳定，不随 id 修改而变），用于勾选与拖拽 */
  var rows = [];
  var selected = {};          // k -> true
  var deviceOrder = [];       // 设备显示顺序
  var devManual = {};         // 手动新增的设备名（用于保留空分组）
  // 没有「全部视图」了 —— 主区永远停在某一个设备上。空串表示「还没定」，
  // render() 里会兜底成 deviceOrder[0]，所以任何地方都不要再用 '__all__'。
  var filterDevice = '';
  // 直接筛选（选择框即时生效）+ 精准搜索（输入即时生效）：
  //   selDevice = 设备名筛选（'' 表示不限）—— 筛选行已随「全部视图」一起去掉，保留变量仅为兼容 matchFilters
  //   selTag    = 状态筛选（'' 全部 / none / pending / done / outlib）—— 同上
  //   searchQ   = 精准搜索词（与 数据ID/昵称/群名称 完全相等才命中）—— 同上
  var selDevice = '';
  var selTag = '';
  var searchQ = '';
  // 搜索【定位】用的查询词 —— 和上面的 searchQ（筛选）是**两回事**：
  // 定位只负责「跳到那一行并高亮」，绝不动表格内容 / 勾选 / 统计。
  var locateQ = '';
  var locateIdx = 0;          // 列表里当前选中的第几条（键盘 ↑↓ 用）
  var locHitTm = null;        // 高亮自动淡出的定时器
  var doneCollapsed = {};     // device -> true(折叠)
  var devListCollapsed = false; // 侧栏「设备列表」是否收起
  var mainView = 'dash';      // 主区当前视图：dash（默认打开）| data | import | export | roster | manage | addDev | backup
  var PICK_N = 38;            // 「选中未分配」按钮一次自下而上选多少条（不足则全取）
  // 不再需要搜索防抖定时器（筛选行已随「全部视图」一起删除）
  var groupInputVal = '';     // 群名输入框的值（重绘时回填，避免输入内容丢失）
  var newDevVal = '';         // 「新增设备」页里输入框的值（同样要回填）
  var uid = 0;

  // ---------- 持久化 ----------
  // 只写 UI 状态这一个键（体积小）—— 供输入框实时保存使用，避免为了记一个数字把几千条 rows 重新序列化
  function saveUI() {
    try { localStorage.setItem(LS_UI, JSON.stringify({ doneCollapsed: doneCollapsed, devListCollapsed: devListCollapsed })); } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(rows));
      localStorage.setItem(LS_DEV, JSON.stringify(deviceOrder));
      localStorage.setItem(LS_MAN, JSON.stringify(devManual));
      saveUI();
    } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) rows = JSON.parse(raw) || [];
      var dv = localStorage.getItem(LS_DEV);
      if (dv) deviceOrder = JSON.parse(dv) || [];
      var dm = localStorage.getItem(LS_MAN);
      if (dm) devManual = JSON.parse(dm) || {};
      var ui = localStorage.getItem(LS_UI);
      if (ui) { var u = JSON.parse(ui) || {}; doneCollapsed = u.doneCollapsed || {}; devListCollapsed = !!u.devListCollapsed; }
    } catch (e) { rows = []; deviceOrder = []; devManual = {}; }
    // 补历史数据缺失的 k
    rows.forEach(function (r) { if (!r.k) r.k = 'r' + (++uid); else { var n = parseInt(String(r.k).slice(1), 10); if (n > uid) uid = n; } });
  }

  // ---------- 工具 ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // ---------- 提示条（可带「撤销」）----------
  // 普通提示 2.6 秒掠过；带撤销按钮的停留 6 秒 —— 得留出按下去的时间。
  // 鼠标悬停在提示条上时暂停倒计时（犹豫的时候不会突然消失）。
  // 同时只存在一条提示：新提示会顶掉旧的，连带把旧的「撤销」一并作废（正好符合"只撤销上一次"）。
  var TOAST_MS = 2600;
  var TOAST_ACT_MS = 6000;
  var toastTimer = null, toastDeadline = 0, toastLeft = 0;
  function hideToast() {
    clearTimeout(toastTimer); toastTimer = null;
    toastLeft = 0;
    $('toast').classList.remove('show');
    var b = $('toastUndo');
    if (b) { b.hidden = true; b.onclick = null; }
  }
  function toast(msg, undoFn) {
    clearTimeout(toastTimer); toastTimer = null;
    $('toastMsg').textContent = msg;
    var b = $('toastUndo');
    if (undoFn) { b.hidden = false; b.onclick = undoFn; } else { b.hidden = true; b.onclick = null; }
    $('toast').classList.add('show');
    toastLeft = undoFn ? TOAST_ACT_MS : TOAST_MS;
    toastDeadline = Date.now() + toastLeft;
    toastTimer = setTimeout(hideToast, toastLeft);
  }
  (function bindToastHover() {
    var t = $('toast');
    // 用全局 mousemove 判断指针是否落在提示条矩形内。
    // 为什么不直接用 mouseenter：提示条是 pointer-events:none（不能挡住底下工具栏的点击），
    // 自己收不到鼠标事件。这样既保住「悬停暂停」，又不拦点击 —— 两全。
    document.addEventListener('mousemove', function (e) {
      if (!t.classList.contains('show')) return;
      var r = t.getBoundingClientRect();
      var inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      if (inside) {
        if (toastTimer) { toastLeft = Math.max(0, toastDeadline - Date.now()); clearTimeout(toastTimer); toastTimer = null; }
      } else if (!toastTimer && toastLeft > 0) {
        toastDeadline = Date.now() + toastLeft;
        toastTimer = setTimeout(hideToast, toastLeft);
      }
    });
  })();

  // ---------- 自定义弹窗 ----------
  var modalOkFn = null;
  var modalHasOk = false;         // 当前弹窗是否有「确定」按钮（无确定按钮时回车不生效）
  function openModal(opt) {
    $('modalTitle').textContent = opt.title || '';
    var body = opt.bodyHtml || '';
    if (opt.input) {
      body += '<input class="modal-input" id="modalInput" placeholder="' + esc(opt.input.placeholder || '') + '" value="' + esc(opt.input.value || '') + '">';
    }
    $('modalBody').innerHTML = body;
    var foot = '<button class="btn" data-modal="cancel">' + esc(opt.cancelText || '取消') + '</button>';
    if (!opt.noOk) foot += '<button class="btn ' + (opt.okRed ? 'red' : 'primary') + '" data-modal="ok">' + esc(opt.okText || '确定') + '</button>';
    $('modalFoot').innerHTML = foot;
    modalOkFn = opt.onOk || null;
    modalHasOk = !opt.noOk;
    $('modalMask').classList.add('show');
    var inp = $('modalInput');
    if (inp) { inp.focus(); if (inp.select) { try { inp.select(); } catch (e) {} } }
  }
  function closeModal() { $('modalMask').classList.remove('show'); $('modalBody').removeAttribute('data-roster'); modalOkFn = null; modalHasOk = false; }
  // 注：data-roster 是弹窗版库管理留下的标记，现在只有这句清理、没人再设置它 —— 留着无害，不动了。
  function confirmModal() {
    var inp = $('modalInput');
    var fn = modalOkFn;
    if (inp) {
      var v = inp.value.trim();
      if (!v) { inp.focus(); return; }        // 输入不能为空
      closeModal(); if (fn) fn(v);
    } else {
      closeModal(); if (fn) fn(null);
    }
  }
  function statusName(s) { return s === 'pending' ? '已分配' : s === 'done' ? '已完成' : '未分配'; }
  function findRow(k) { for (var i = 0; i < rows.length; i++) if (rows[i].k === k) return rows[i]; return null; }
  function shortDate(s) {
    if (!s) return '';
    var m = String(s).match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);
    if (m) return (+m[2]) + '/' + (+m[3]);
    return s.length > 8 ? s.slice(0, 8) : s;
  }
  // 昵称这类长文本的限宽，改由「表格固定列宽 + CSS 省略号」处理（见 CSS 里的 table 规则），
  // 这里不再对文本做任何截断 —— DOM 里始终是完整昵称。


  // ---------- 名单库 & 「不在库」判定 ----------
  // 「不在库」= 该行**还是「未分配」**、且它的 数据ID 不在名单库里。
  //   · 判定是**实时算**的，不写进数据 —— 名单库更新后，旧数据的标记会自动跟着变，不用重新导入。
  //   · 已经进入流程的行（进行中 / 已完成）不再判库。
  //   · ID 比对**不区分大小写**（名单库里有含字母的 ID，如 wm66666666miao）。
  //
  // 名单库来源三种（互斥，在「库管理」里切换）：
  //   cloud = 使用云端名单库：每次打开比对版本号，有新版才下载 → 存 IndexedDB
  //   local = 本地上传名单库：手动选文件，与已有库【合并】（重复覆盖、新增新增）
  //   none  = 不使用：关闭「在库」检测
  //
  // 云端地址用 GitHub Pages（raw.githubusercontent.com 在国内不通，不能用）；
  // 客户端用 <script src> 加载而**不是 fetch** —— 工具是 file:// 双击打开的，fetch 会被跨域拦死。
  var ROSTER_CLOUD = {
    page: 'https://cvrtgbp2dn-code.github.io/lq-roster/',
    cdn: 'https://fastly.jsdelivr.net/gh/cvrtgbp2dn-code/lq-roster@main/'   // 备用源
  };
  var ROSTER_MODES = ['cloud', 'local', 'none'];
  var ROSTER_MODE = 'cloud';                    // 默认：使用云端名单库
  var rosterInfo = { ids: '', version: '', updatedAt: 0 };   // 当前生效的那一份
  var rosterSet = new Set();
  var rosterSyncing = false;
  var rosterEpoch = 0;   // 每次切换来源 +1；下载回来时若纪元变了就丢弃，避免「下载中途切走」把数据写错槽位

  // ---------- IndexedDB（localStorage 只有 5MB，装不下 40 万条）----------
  var IDB_NAME = 'lq_helper_roster', IDB_STORE = 'kv', idbPromise = null;
  function idbOpen() {
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
      var req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb open fail')); };
    });
    return idbPromise;
  }
  function idbOp(mode, fn) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, mode);
        var r = fn(tx.objectStore(IDB_STORE));
        r.onsuccess = function () { resolve(r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function idbGet(k) { return idbOp('readonly', function (s) { return s.get(k); }); }
  function idbPut(k, v) { return idbOp('readwrite', function (s) { return s.put(v, k); }); }
  function idbDel(k) { return idbOp('readwrite', function (s) { return s.delete(k); }); }
  function slotKey(mode) { return mode === 'cloud' ? 'src_cloud' : 'src_local'; }

  // 把 ids 长字符串建成内存索引（40 万条约 120ms，无需进度条）
  function applyRoster() {
    var s = new Set();
    if (rosterInfo.ids) {
      var arr = rosterInfo.ids.split('\n');
      for (var i = 0; i < arr.length; i++) {
        var v = arr[i].trim();
        if (v) s.add(v.toLowerCase());
      }
    }
    rosterSet = s;
  }
  function rosterActive() { return ROSTER_MODE !== 'none' && rosterSet.size > 0; }
  function outOfLib(r) {
    if (!rosterActive()) return false;                     // 不使用 / 库为空 → 一律视为在库
    if (r.status !== 'none') return false;                 // 已进入流程的不再判库
    return !rosterSet.has(String(r.id == null ? '' : r.id).trim().toLowerCase());
  }
  // 状态列的展示：不丢进 status，而是渲染时算出来
  function badgeOf(r) {
    if (outOfLib(r)) return { cls: 'outlib', text: '不在库' };
    return { cls: r.status, text: statusName(r.status) };
  }
  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // 启动时读取本机缓存的名单库
  function initRoster() {
    return Promise.all([idbGet('mode'), idbGet('src_cloud'), idbGet('src_local')]).then(function (r) {
      if (r[0] && ROSTER_MODES.indexOf(r[0]) !== -1) ROSTER_MODE = r[0];
      var d = ROSTER_MODE === 'cloud' ? r[1] : (ROSTER_MODE === 'local' ? r[2] : null);
      if (d) rosterInfo = { ids: d.ids || '', version: d.version || '', updatedAt: d.updatedAt || 0 };
      applyRoster();
    }).catch(function () { /* IndexedDB 不可用时降级为内存态，不影响其它功能 */ });
  }
  function saveCurrentSlot() {
    if (ROSTER_MODE === 'none') return Promise.resolve();
    var d = { ids: rosterInfo.ids, version: rosterInfo.version, updatedAt: rosterInfo.updatedAt };
    return idbPut(slotKey(ROSTER_MODE), d).catch(function () {});
  }

  // ---------- 云端名单库 ----------
  function loadScript(url, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      var done = false;
      function fin(ok, err) {
        if (done) return; done = true;
        if (!ok) { try { s.parentNode.removeChild(s); } catch (e) {} }
        if (ok) resolve(); else reject(err);
      }
      s.src = url;
      s.onload = function () { fin(true); };
      s.onerror = function () { fin(false, new Error('load fail')); };
      document.head.appendChild(s);
      setTimeout(function () { fin(false, new Error('timeout')); }, timeoutMs || 60000);
    });
  }
  // 返回 {updated, version, count, ms} 或 null（不需要更新 / 全部源都失败）
  function cloudSync() {
    if (ROSTER_MODE !== 'cloud' || rosterSyncing) return Promise.resolve(null);
    rosterSyncing = true;
    var ep = rosterEpoch;
    function stale() { return ep !== rosterEpoch || ROSTER_MODE !== 'cloud'; }
    var bases = [ROSTER_CLOUD.page, ROSTER_CLOUD.cdn];
    function finish(v) { rosterSyncing = false; return v; }
    function tryBase(i) {
      if (i >= bases.length) return Promise.resolve(finish(null));
      if (stale()) return Promise.resolve(finish(null));
      var base = bases[i], ver = '', t0 = Date.now();
      return loadScript(base + 'version.js?t=' + Date.now(), 30000).then(function () {
        if (stale()) return finish(null);
        ver = String(window.__ROSTER_VERSION__ || '');
        if (!ver) throw new Error('no version');
        if (ver === rosterInfo.version && rosterInfo.ids) return finish(null);   // 已是最新
        window.__ROSTER__ = null;
        return loadScript(base + 'roster.js?v=' + encodeURIComponent(ver), 180000).then(function () {
          var txt = window.__ROSTER__;
          if (!txt) throw new Error('empty roster');
          if (stale()) return finish(null);                    // 期间用户切走了 → 整包丢弃
          rosterInfo.ids = txt;
          rosterInfo.version = ver;
          rosterInfo.updatedAt = Date.now();
          applyRoster();
          return saveCurrentSlot().then(function () {
            return finish({ updated: true, version: ver, count: rosterSet.size, ms: Date.now() - t0, base: base });
          });
        });
      }).catch(function () { return tryBase(i + 1); });
    }
    return tryBase(0);
  }

  // ---------- 本地上传名单库（合并：重复覆盖、新增新增）----------
  // 支持 .csv（取第一列）和 .txt（整行即一个 ID），自动识别 UTF-8 / GBK
  function parseRosterText(text) {
    var out = [], arr = String(text).split(/\r?\n/);
    for (var i = 0; i < arr.length; i++) {
      var line = arr[i];
      if (!line) continue;
      var v = line.split(',')[0].replace(/^\uFEFF/, '').replace(/^"|"$/g, '').trim();
      if (v) out.push(v);
    }
    return out;
  }
  function mergeIntoRoster(newIds) {
    var set = new Set();
    if (rosterInfo.ids) {
      var old = rosterInfo.ids.split('\n');
      for (var i = 0; i < old.length; i++) { var v = old[i].trim(); if (v) set.add(v.toLowerCase()); }
    }
    var before = set.size;
    for (var j = 0; j < newIds.length; j++) { var w = newIds[j].toLowerCase(); if (w) set.add(w); }
    rosterInfo.ids = Array.from(set).join('\n');
    rosterInfo.version = '';
    rosterInfo.updatedAt = Date.now();
    return { total: set.size, added: set.size - before, dup: newIds.length - (set.size - before) };
  }

  // ---------- 库管理弹窗 ----------
  function refreshRosterModal() {
    // 库管理现在是主区整页视图，重绘整页即可
    if (mainView === 'roster') render();
  }
  function rosterBodyHtml() {
    var h = '';
    // ① 云端
    var cloudSub;
    if (ROSTER_MODE === 'cloud' && rosterSet.size) {
      cloudSub = '<span style="color:var(--green)">已连接</span> · <b>' + rosterSet.size.toLocaleString() +
        '</b> 条 · 更新于 ' + fmtTime(rosterInfo.updatedAt);
    } else if (ROSTER_MODE === 'cloud') {
      cloudSub = rosterSyncing ? '正在下载名单库…'
        : '<span style="color:var(--orange)">尚未取得名单库</span>（联网后重新打开工具会自动下载）';
    } else {
      cloudSub = '每次打开自动比对版本号，有新版才下载';
    }
    h += '<div class="rs-opt' + (ROSTER_MODE === 'cloud' ? ' on' : '') + '" data-act="rsMode" data-mode="cloud">' +
      '<span class="rs-radio"></span><div style="flex:1"><b>使用云端名单库</b>' +
      '<div class="rs-sub">' + cloudSub + '</div></div></div>';
    // ② 本地
    var localSub = (ROSTER_MODE === 'local' && rosterSet.size)
      ? '当前 <b>' + rosterSet.size.toLocaleString() + '</b> 条 · 更新于 ' + fmtTime(rosterInfo.updatedAt)
      : '选择 .csv / .txt 文件导入；重复的数据ID会覆盖，新增的会追加';
    h += '<div class="rs-opt' + (ROSTER_MODE === 'local' ? ' on' : '') + '" data-act="rsMode" data-mode="local">' +
      '<span class="rs-radio"></span><div style="flex:1"><b>本地上传名单库</b>' +
      '<div class="rs-sub">' + localSub + '</div>' +
      '<div class="rs-btns"><button class="btn" data-act="rsPick">选择文件…</button>' +
      '<button class="btn" data-act="rsClear"' + (rosterSet.size ? '' : ' disabled') + '>清空名单库</button>' +
      '</div></div></div>';
    // ③ 不使用
    h += '<div class="rs-opt' + (ROSTER_MODE === 'none' ? ' on' : '') + '" data-act="rsMode" data-mode="none">' +
      '<span class="rs-radio"></span><div style="flex:1"><b>不使用</b>' +
      '<div class="rs-sub">关闭「在库」检测，所有数据都按正常流程走</div></div></div>';
    return h;
  }
  // 切换来源（互斥）。先把当前这份存进它自己的槽位，再读取目标槽位 —— 来回切换不丢数据、不重复下载。
  function setRosterMode(mode) {
    if (ROSTER_MODES.indexOf(mode) === -1 || mode === ROSTER_MODE) return Promise.resolve();
    var oldMode = ROSTER_MODE, oldData = { ids: rosterInfo.ids, version: rosterInfo.version, updatedAt: rosterInfo.updatedAt };
    ROSTER_MODE = mode;
    rosterEpoch++;        // 让还在飞行中的云端下载作废
    rosterSyncing = false;
    var chain = (oldMode === 'none') ? Promise.resolve() : idbPut(slotKey(oldMode), oldData).catch(function () {});
    return chain.then(function () { return idbPut('mode', mode).catch(function () {}); })
      .then(function () { return mode === 'none' ? null : idbGet(slotKey(mode)).catch(function () { return null; }); })
      .then(function (d) {
        rosterInfo = d ? { ids: d.ids || '', version: d.version || '', updatedAt: d.updatedAt || 0 }
                       : { ids: '', version: '', updatedAt: 0 };
        applyRoster();
        render();                        // 必须重绘：切换来源会让红标整体变化
      }).catch(function () {
        rosterInfo = { ids: '', version: '', updatedAt: 0 };
        applyRoster();
        render();
      });
  }
  function pickRosterFile() {
    var go = (ROSTER_MODE === 'local') ? Promise.resolve() : setRosterMode('local');
    go.then(function () {
      refreshRosterModal();
      var fi = $('rosterFile');
      fi.value = '';
      fi.click();
    });
  }
  function onRosterFileChosen(files) {
    var f = files && files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var ids = parseRosterText(decodeBuffer(fr.result));
      if (!ids.length) { toast('这个文件里没有读到任何数据ID'); return; }
      // 先把合并前的样子存下来，再动手改 —— 顺序反了就没得撤了
      var before = { ids: rosterInfo.ids, version: rosterInfo.version, updatedAt: rosterInfo.updatedAt };
      var r = mergeIntoRoster(ids);
      saveCurrentSlot();
      applyRoster();
      render();
      refreshRosterModal();
      toast('名单库已更新：共 ' + r.total.toLocaleString() + ' 条（新增 ' + r.added.toLocaleString() +
        '，重复 ' + r.dup.toLocaleString() + '）', function () {
        rosterInfo = { ids: before.ids, version: before.version, updatedAt: before.updatedAt };
        saveCurrentSlot(); applyRoster(); render(); refreshRosterModal();
        toast('已撤销导入');
      });
    };
    fr.readAsArrayBuffer(f);
  }
  function clearRoster() {
    if (!rosterSet.size) { toast('名单库本来就是空的'); return; }
    var n = rosterSet.size;
    var before = { ids: rosterInfo.ids, version: rosterInfo.version, updatedAt: rosterInfo.updatedAt };
    rosterInfo = { ids: '', version: '', updatedAt: 0 };
    rosterSet = new Set();
    idbDel(slotKey(ROSTER_MODE)).catch(function () {});
    render(); refreshRosterModal();
    toast('已清空名单库（' + n.toLocaleString() + ' 条）', function () {
      rosterInfo = before;
      saveCurrentSlot(); applyRoster(); render(); refreshRosterModal();
      toast('已撤销清空');
    });
  }

  // ---------- 导入解析 ----------
  function parseHtmlTable(text) {
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var trs = doc.querySelectorAll('table tr');
    var out = [], colMap = null;
    for (var i = 0; i < trs.length; i++) {
      var tds = trs[i].querySelectorAll('td,th');
      if (!tds.length) continue;
      var cells = [];
      for (var j = 0; j < tds.length; j++) cells.push(tds[j].textContent.trim());
      var joined = cells.join('|');
      if (joined.indexOf('数据ID') !== -1) {
        colMap = {};
        for (var k = 0; k < cells.length; k++) {
          var h = cells[k];
          if (h.indexOf('类型名称') !== -1 || h.indexOf('设备') !== -1) colMap.device = k;
          else if (h.indexOf('昵称') !== -1) colMap.nick = k;
          else if (h.indexOf('数据ID') !== -1 || h === 'ID') colMap.id = k;
          else if (h.indexOf('数据类型') !== -1) colMap.dtype = k;
          else if (h.indexOf('时间') !== -1 || h.indexOf('日期') !== -1) colMap.date = k;
        }
        if (colMap.id == null) colMap.id = 2;
        if (colMap.nick == null) colMap.nick = 1;
        if (colMap.device == null) colMap.device = 0;
        if (colMap.date == null) colMap.date = 4;
        continue;
      }
      if (!colMap) colMap = { device: 0, nick: 1, id: 2, dtype: 3, date: 4 };
      var idVal = (cells[colMap.id] || '').trim();
      if (!idVal) continue;
      out.push({
        id: idVal,
        nick: (cells[colMap.nick] || '').trim(),
        device: (cells[colMap.device] || '').trim() || '未知设备',
        dtype: colMap.dtype != null ? (cells[colMap.dtype] || '').trim() : '',
        date: colMap.date != null ? (cells[colMap.date] || '').trim() : ''
      });
    }
    return out;
  }

  function parseCsv(text) {
    var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    var out = [], colMap = null;
    lines.forEach(function (line) {
      var cells = line.split(/[,\t]/).map(function (s) { return s.trim().replace(/^"|"$/g, ''); });
      var joined = cells.join('|');
      if (joined.indexOf('数据ID') !== -1) {
        colMap = {};
        cells.forEach(function (h, k) {
          if (h.indexOf('类型名称') !== -1 || h.indexOf('设备') !== -1) colMap.device = k;
          else if (h.indexOf('昵称') !== -1) colMap.nick = k;
          else if (h.indexOf('数据ID') !== -1) colMap.id = k;
          else if (h.indexOf('数据类型') !== -1) colMap.dtype = k;
          else if (h.indexOf('时间') !== -1 || h.indexOf('日期') !== -1) colMap.date = k;
        });
        return;
      }
      if (!colMap) colMap = { device: 0, nick: 1, id: 2, dtype: 3, date: 4 };
      if (!cells[colMap.id]) return;
      out.push({
        id: cells[colMap.id], nick: cells[colMap.nick] || '',
        device: cells[colMap.device] || '未知设备',
        dtype: cells[colMap.dtype] || '', date: cells[colMap.date] || ''
      });
    });
    return out;
  }

  // 纯文本格式：每行 "数据ID--昵称"，"--" 为分隔符，无设备名 → 用文件名当设备名
  function parseTxt(text, deviceName) {
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      line = line.replace(/^\uFEFF/, '').trim();
      if (!line || line === '--') return;
      var i = line.indexOf('--');
      if (i === -1) return;
      var id = line.slice(0, i).trim();
      var nick = line.slice(i + 2).trim();
      if (!id) return;
      out.push({ id: id, nick: nick, device: deviceName || '未知设备', dtype: '', date: '' });
    });
    return out;
  }

  // 解码：UTF-8 与 GBK 都试一遍，谁解出的乱码替换符更少就用谁
  // 文件自己声明的编码最可靠 —— WPS 导出的 .xls 实为 HTML，头部一定带 <meta charset=…>。
  // 只在「文件开头像 HTML/XML」时才认这个声明，避免普通 CSV/TXT 里恰好出现 "charset=" 被误命中。
  function declaredCharset(u8) {
    var n = Math.min(u8.length, 2048), head = '';
    for (var i = 0; i < n; i++) head += String.fromCharCode(u8[i]);
    var t = head.replace(/^\uFEFF/, '').replace(/^\s+/, '');
    if (t.charAt(0) !== '<') return '';
    var m = head.match(/charset\s*=\s*["']?\s*([A-Za-z0-9_-]+)/i);
    if (!m) return '';
    var c = m[1].toLowerCase();
    if (c === 'gb2312' || c === 'gbk' || c === 'gb18030' || c === 'cp936') return 'gbk';
    if (c === 'utf8' || c === 'utf-8') return 'utf-8';
    return '';
  }

  // 把 CESU-8（6 字节「代理对」写法，部分采集/导出工具写 Emoji 用这种）还原成标准 4 字节 UTF-8。
  // 标准 UTF-8 解码器遇到 CESU-8 会直接吐替换符 —— 这是「Emoji 变乱码」的常见根因之一。
  function fixCesu(u8) {
    var n = u8.length, i = 0, out = [];
    while (i < n) {
      if (u8[i] === 0xED && i + 5 < n &&
          (u8[i + 1] & 0xF0) === 0xA0 && (u8[i + 2] & 0xC0) === 0x80 &&
          u8[i + 3] === 0xED && (u8[i + 4] & 0xF0) === 0xB0 && (u8[i + 5] & 0xC0) === 0x80) {
        var hi = 0xD800 + ((u8[i + 1] & 0x0F) << 6) + (u8[i + 2] & 0x3F);
        var lo = 0xDC00 + ((u8[i + 4] & 0x0F) << 6) + (u8[i + 5] & 0x3F);
        var cp = 0x10000 + ((hi - 0xD800) << 10) + (lo - 0xDC00);
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
        i += 6; continue;
      }
      out.push(u8[i]); i++;
    }
    return (out.length === n) ? u8 : new Uint8Array(out);
  }

  function decodeBuffer(buf) {
    var u8 = new Uint8Array(buf);

    // BOM：带 BOM 的文件直接按 BOM 定编码（UTF-8 / UTF-16LE / UTF-16BE）
    if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF)
      return new TextDecoder('utf-8', { fatal: false }).decode(u8.subarray(3)).replace(/\uFFFD/g, '');
    if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE)
      return new TextDecoder('utf-16le', { fatal: false }).decode(u8.subarray(2)).replace(/\uFFFD/g, '');
    if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF)
      return new TextDecoder('utf-16be', { fatal: false }).decode(u8.subarray(2)).replace(/\uFFFD/g, '');

    function dec(enc, bytes) { try { return new TextDecoder(enc, { fatal: false }).decode(bytes); } catch (e) { return null; } }
    function bad(s) { return s == null ? Infinity : (s.match(/\uFFFD/g) || []).length; }

    var fixed = fixCesu(u8);                        // 先修 Emoji 的 CESU-8 写法
    var utf8 = dec('utf-8', fixed);
    var badUtf8 = bad(utf8);
    if (badUtf8 === 0) return utf8;                 // 干净 UTF-8（含修复后的 Emoji），直接返回

    // ② 没有声明时，比「乱码**占比**」而不是「乱码**个数**」。
    //    为什么不能比个数：GBK 的合法尾字节范围是 0x40~0xFE（除 0x7F），**恰好包含 0x80~0xBF**，
    //    而 UTF-8 的中文是「E4~E9 + 两个 0x80~0xBF」—— 整段字节拿去当 GBK 解几乎不产生 �，
    //    于是"谁乱码少"永远是 GBK 赢 → 整表变乱码。（实测：真机 .xls 的 UTF-8 坏字符 57 个、
    //    GBK 坏字符只有 16 个，比个数、比占比都会误判成 GBK，所以 ① 那一步是主力。）
    //    占比能分开的是另一种情况：GBK 文件当 UTF-8 解，坏字节占比通常 30% 以上；
    //    而 UTF-8 文件只是个别字节坏了（比如表情符号在导出时损坏），占比一般不到 10%。

  function importFiles(files) {
    var pending = files.length, added = 0, dup = 0;
    var existIds = {};
    var touched = {};                  // 本次新增的数据落在哪些设备上（用来决定导入后跳到哪）
    rows.forEach(function (r) { existIds[r.id] = true; });
    var today = todayStr();
    Array.prototype.forEach.call(files, function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        var text = decodeBuffer(reader.result);
        var parsed;
        if (/\.csv$/i.test(f.name)) parsed = parseCsv(text);
        else if (/\.txt$/i.test(f.name)) parsed = parseTxt(text, f.name.replace(/\.[^.]+$/, ''));
        else parsed = parseHtmlTable(text);
        parsed.forEach(function (p) {
          if (existIds[p.id]) { dup++; return; }
          existIds[p.id] = true;
          touched[p.device] = true;
          rows.push({ k: 'r' + (++uid), id: p.id, nick: p.nick, device: p.device, dtype: p.dtype, date: today, group: '', status: 'none' });
          added++;
        });
        if (--pending === 0) {
          // 导入完成后自动跳到「刚导进来的那批数据」所在的地方。
          // 没有「全部视图」了，所以：有新增就停在本次第一个设备；一条都没新增则不动。
          // 用「实际涉及的设备数」判断，而不是「选了几个文件」——
          // 一个 .xls 里可能混着多个设备名，多个 .txt 则一个文件一个设备。
          var devs = Object.keys(touched);
          if (devs.length) filterDevice = devs[0];
          if (added) {
            // 与「点击侧栏切换设备」保持一致的清理：
            selected = {};         // 清掉勾选，避免跨设备错乱
            groupInputVal = '';    // 清掉群名框
            // 筛选/搜索条件也必须清掉：否则新导入的数据可能被旧条件挡在外面，看着像没导进来
            selDevice = ''; selTag = ''; searchQ = '';
          }
          mainView = 'data';       // 导入完成，主区从导入页切回数据表
          save(); render();
          toast('导入完成：新增 ' + added + ' 条' + (dup ? '，按数据ID去重跳过 ' + dup + ' 条' : '') +
            (devs.length ? '（已切到 ' + devs[0] + (devs.length > 1 ? ' 等 ' + devs.length + ' 个设备' : '') + '）' : ''));
        }
      };
      reader.readAsArrayBuffer(f);
    });
  }

  // 导出用的目标行：已分配（有群名、未完成）的数据，**按侧栏的设备顺序排好**再输出。

      // fills[2] 就是 A 列（群名称）的底色，用的是和 1096.xlsx 那一格**完全相同的主题色引用**
      // —— theme=9（accent6 = E54C5E）tint=0.8 白化。
      // 这里必须写 tint=0.8：WPS 的「填充颜色」面板里，主题色那一块列出的正是
      // 80% / 60% / 40% / -25% / -50% 这几档明暗，源表用的就是 **最浅那档（80%）**。
      // 换算：E5 + (255-E5)*0.8 = FA；4C → DB；5E → DF，即 #FADBDF。
      // （曾经的坑：误读成 tint=0.6 → #F5B7BF，颜色偏深，用户在面板里对不上。）
      // 因为上面 THEME_XML 也一并搬成了 1096.xlsx 的主题，所以两边解析出来的颜色必然逐位相同。
      ['xl/styles.xml',
        '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        '<numFmts count="0"/>' +
        '<fonts count="1"><font><sz val="11"/><color theme="1"/><name val="宋体"/><charset val="134"/><scheme val="minor"/></font></fonts>' +
        '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
        '<fill><patternFill patternType="solid"><fgColor theme="9" tint="0.8"/><bgColor indexed="64"/></patternFill></fill></fills>' +
        '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"><alignment vertical="center"/></xf></cellStyleXfs>' +
        // s=0 → 普通数据格；s=1 → A 列数据格（多一个底色）
        '<cellXfs count="2">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        '<xf numFmtId="0" fontId="0" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="center"/></xf>' +
        '</cellXfs>' +
        '<cellStyles count="1"><cellStyle name="常规" xfId="0" builtinId="0"/></cellStyles>' +
        '<dxfs count="0"/>' +
        '<tableStyles count="0" defaultTableStyle="TableStyleMedium2" defaultPivotStyle="PivotStyleLight16"/>' +
        '</styleSheet>'],
      ['xl/sharedStrings.xml',
        '<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="' + (targets.length * 4) + '" uniqueCount="' + sst.length + '">' +
        sst.map(function (v) { return '<si><t xml:space="preserve">' + xmlEsc(v) + '</t></si>'; }).join('') +
        '</sst>'],
      ['xl/worksheets/sheet1.xml',
        '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        '<sheetPr/><dimension ref="' + DIM + '"/>' +
        '<sheetViews><sheetView workbookViewId="0"/></sheetViews>' +
        // 行高 13.5、默认列宽 9、A/B/C/D 列宽全部照搬 1096.xlsx 的存储值
        // （Excel/WPS 界面显示为 A=30 / B=25 / C=25 / D=8.38）
        '<sheetFormatPr defaultColWidth="9" defaultRowHeight="13.5"/>' +
        '<cols><col min="1" max="1" width="30.625" customWidth="1"/><col min="2" max="3" width="25.625" customWidth="1"/><col min="4" max="4" width="9" customWidth="1"/></cols>' +
        '<sheetData>' + body + '</sheetData>' +
        // 数据ID 按文本存，用 ignoredErrors 声明「数字以文本存储」不算错，绿三角不出现。
        // sqref 必须收在真实数据范围内：早先写成 A1:D1048576 会把整张表的「已使用区域」
        // 撑到最后一行（实测真实表格引擎读出来的 used_range 直接变成满表 200 行），
        // 于是「全选 / 填充颜色 / Ctrl+End / 滚动条」全都跟着变形 —— 这正是「导出的文件和
        // 我电脑上另存的文件不一样」的根因。
        '<ignoredErrors><ignoredError sqref="' + DIM + '" numberStoredAsText="1"/></ignoredErrors>' +
        '</worksheet>']
    ];
    return list.map(function (p) { return { name: p[0], data: enc(XML_HEAD + p[1]) }; });
  }

  function downloadBlob(blob, fname) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // ---------- 选中集合辅助 ----------
  function keysOf(list) { return list.map(function (r) { return r.k; }); }
  // 可勾选 / 可批量操作的行 = 未完成 且 不在「不在库」里。
  // 「不在库」是死胡同，不参与勾选、批量设群名、删除选中。
  function groupPickableRows(dev) { return rows.filter(function (r) { return r.device === dev && r.status !== 'done' && !outOfLib(r); }); }
  // 搜索匹配（模块级，供 render 与 doneRowsOfDev 共用，避免条件写歪）
  // 筛选 + 精准搜索。选择框即时生效；搜索为「精准」= 与 数据ID/昵称/群名称 完全相等（忽略大小写与首尾空格）。
  function matchFilters(r) {
    if (selDevice && r.device !== selDevice) return false;
    if (selTag === 'outlib') { if (!outOfLib(r)) return false; }
    else if (selTag && r.status !== selTag) return false;
    if (searchQ) {
      var q = searchQ;
      var hit = (String(r.id || '').trim().toLowerCase() === q) ||
                (String(r.nick || '').trim().toLowerCase() === q) ||
                (String(r.group || '').trim().toLowerCase() === q);
      if (!hit) return false;
    }
    return true;
  }
  // 该设备「当前可见」的已完成行 —— 口径与界面上「已完成（N）」的 N 完全一致
  function doneRowsOfDev(dev) {
    return rows.filter(function (r) { return r.device === dev && r.status === 'done' && matchFilters(r); });
  }
  // 自下而上取最多 n 个「未分配」（排除不在库 / 已完成）；不足 n 则全取。
  // ⚠️ 是**从列表底部往上数** —— 列表底部 = 最近导入的数据。
  function tailPick(dev, n) {
    var list = groupPickableRows(dev).filter(function (r) { return r.status === 'none'; });
    return list.slice(Math.max(0, list.length - n));
  }
  function selCount() { var n = 0; for (var k in selected) if (selected[k]) n++; return n; }
  // 只刷新与选中相关的界面（勾选数 + 行勾选框 + 表头全选框/半选态），不重绘整个列表
  function refreshSelectionUI() {
    var sc = $('selCount'); if (sc) sc.textContent = selCount();
    // 行勾选框与 selected 同步（点表头全选/取消后，行上的小方框要跟着变）
    var rs = document.querySelectorAll('input[data-act="check"]');
    for (var r = 0; r < rs.length; r++) {
      rs[r].checked = !!selected[rs[r].getAttribute('data-k')];
    }
    var boxes = document.querySelectorAll('input[data-act="checkAll"]');
    for (var i = 0; i < boxes.length; i++) {
      var dvv = boxes[i].getAttribute('data-dev');
      var list = groupPickableRows(dvv);
      var on = 0;
      for (var j = 0; j < list.length; j++) if (selected[list[j].k]) on++;
      boxes[i].checked = list.length > 0 && on === list.length;
      boxes[i].indeterminate = on > 0 && on < list.length;
    }
    // 勾选变了 →「选中未分配」按钮的激活态可能跟着变（勾选不触发 input 事件，所以必须在这里做）
    var pkBtn = document.querySelector('.vb-btn[data-act="pickTail"]');
    if (pkBtn) pkBtn.className = 'vb-btn' + (tailAllSelected() ? ' on' : '');
  }

  // ---------- 渲染 ----------
  function render() {
    // 离开数据表（去导入/导出/库管理等整页）就把搜索定位框清掉，别把旧词带过去
    if (mainView !== 'data') { locateQ = ''; locateIdx = 0; }
    // 同理：离开仪表盘就把大搜索框清掉
    if (mainView !== 'dash') { dashQ = ''; dashIdx = 0; }
    // 统计数字现在由 viewBarHtml() 里的 vbStatsHtml() 直接渲染成 HTML（按当前视图算），
    // 不再在这里单独赋值 —— 元素在 main 里，赋值必须等到 innerHTML 之后才行。

    // 设备顺序：补入新出现的设备，并清理「无数据且非手动新增」的设备
    rows.forEach(function (r) { if (deviceOrder.indexOf(r.device) === -1) deviceOrder.push(r.device); });
    var hasRows = {};
    rows.forEach(function (r) { hasRows[r.device] = true; });
    deviceOrder = deviceOrder.filter(function (d) { return hasRows[d] || devManual[d]; });
    // 没有「全部视图」：当前设备不存在了就退回第一个设备
    if (deviceOrder.indexOf(filterDevice) === -1) filterDevice = deviceOrder[0] || '';

    // 侧栏三段式：标题 / 设备列表（撑满、自己滚）/ 底部全局操作
    var counts = {};
    rows.forEach(function (r) { if (r.status !== 'done') counts[r.device] = (counts[r.device] || 0) + 1; });
    var sb = '<div class="side-head"><h1>拉群小助手</h1></div>';
    sb += '<div class="side-list">';
    // ① 仪表盘（放在设备列表**上面**，单独一项）
    //   ⚠️ 图标平时灰、**激活时才上该项目的色**（--ac）—— 全侧栏统一这套规则
    sb += '<button class="side-act side-dash' + (mainView === 'dash' ? ' active' : '') + '" data-act="openDash"' +
      ' style="--ac:' + FUNC_COLORS.dash + '" title="总览：搜人 + 全局统计">' + ICON.grid + '<span>仪表盘</span></button>' +
      '<div class="side-hr"></div>';
    // ② 设备列表
    sb += '<div class="side-title' + (devListCollapsed ? '' : ' open') + '" data-act="toggleDevList" title="点击收起 / 展开设备列表">' +
      ICON.list + '<span>设备列表</span><span class="dt-caret">' + (devListCollapsed ? '▸' : '▾') + '</span></div>';
    sb += '<div class="dev-list-body"' + (devListCollapsed ? ' hidden' : '') + '>';
    deviceOrder.forEach(function (dev) { sb += devItemHtml(dev, dev, counts[dev] || 0); });
    sb += '<button class="side-add' + (mainView === 'addDev' ? ' active' : '') + '" data-act="openAddDev" style="--ac:' + FUNC_COLORS.add + '">' + ICON.plus + '<span>新增设备</span></button>';
    sb += '<button class="side-add' + (mainView === 'manage' ? ' active' : '') + '" data-act="openManage" style="--ac:' + FUNC_COLORS.mg + '">' + ICON.manage + '<span>管理设备</span></button>';
    sb += '</div></div>';
    // 底部四个全局操作（原来在工具栏里）。注意：监听得用事件委托 —— 侧栏每次重绘都会重建这些按钮。
    // 图标**平时灰**、**激活时才上色**，各用各的色（由 --ac 交给 CSS，见 .side-act 规则）。
    sb += '<div class="side-foot">' +
      '<button class="side-act' + (mainView === 'import' ? ' active' : '') + '" data-act="openImport" style="--ac:' + FUNC_COLORS.imp + '">' + ICON.imp + '<span>导入采集表格</span></button>' +
      '<button class="side-act' + (mainView === 'export' ? ' active' : '') + '" data-act="openExport" style="--ac:' + FUNC_COLORS.exp + '">' + ICON.exp + '<span>导出交单表格</span></button>' +
      '<button class="side-act' + (mainView === 'roster' ? ' active' : '') + '" data-act="openRoster" style="--ac:' + FUNC_COLORS.book + '">' + ICON.book + '<span>数据库管理</span></button>' +
      '<button class="side-act' + (mainView === 'backup' ? ' active' : '') + '" data-act="openBackup" style="--ac:' + FUNC_COLORS.arch + '">' + ICON.arch + '<span>数据备份</span></button></div>';
    // ⚠️ 侧栏整体重绘会重建 .side-list，它的内部滚动位置会归零 —— 设备多的时候，
    // 点一下「管理设备」列表就「自动滑回顶部」，很别扭。这里先存位置、重绘后还原。
    var oldList = document.querySelector('.side-list');
    var keepTop = oldList ? oldList.scrollTop : 0;
    $('sidebar').innerHTML = sb;
    var newList = document.querySelector('.side-list');
    if (newList && keepTop) newList.scrollTop = keepTop;

    // 主区
    var main = $('main');
    // 三个侧栏操作改为主区整页视图（不再弹窗）
    if (mainView === 'import') { main.innerHTML = importPageHtml(); wireImportPage(); return; }
    if (mainView === 'export') { main.innerHTML = exportPageHtml(); return; }
    if (mainView === 'roster') { main.innerHTML = rosterPageHtml(); return; }
    if (mainView === 'manage') { main.innerHTML = managePageHtml(); return; }
    if (mainView === 'addDev') { main.innerHTML = addDevPageHtml(); return; }
    if (mainView === 'backup') { main.innerHTML = backupPageHtml(); return; }
    // 仪表盘：放在「还没有数据」那句之前 —— 没数据时也该能看到搜索框和 0
    if (mainView === 'dash') { main.innerHTML = dashPage2Html(); return; }
    if (!rows.length) {
      main.innerHTML = '<div class="empty"><div class="big">📋</div>还没有数据，点击左上角「导入采集表格」开始<br><span style="font-size:12px">支持采集报表 .xls / .csv，以及 .txt（格式 ID--昵称，文件名将作为设备名）；可多选多个设备文件一起导入</span></div>';
      return;
    }
    // 操作栏在卡片**下方**（并且吸在窗口底部），所以先拼卡片、最后再拼操作栏
    var html = '';
    var dev = filterDevice;
    var list = rows.filter(function (r) { return r.device === dev; });
    var vis = list.filter(matchFilters);
    if (vis.length) html += groupCard(dev, vis);
    else if (!list.length) html += emptyGroupCard(dev);
    else html += '<div class="empty">没有匹配的数据</div>';
    html += viewBarHtml();
    main.innerHTML = html;
    refreshSelectionUI();
  }
