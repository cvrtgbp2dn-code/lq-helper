  // ==================== 侧栏图标配色（只用于「激活态」） ====================
  // ⚠️ 设计约定（2026-10-12 与牛牛确认）：
  //    图标**平时是灰的**，**只有激活时才上色**，而且**每一项用自己那一项的颜色**。
  //    颜色是"你现在停在哪一项"的表达，不是图标的装饰 —— 别再做成常驻彩色 ✗
  // 两级配色（按他要求"功能项和设备项分层级"）：
  //    功能层：饱和度高一点，激活时颜色更实
  //    设备层：同一套色相家族，降饱和/提明度 → **更柔和**
  var FUNC_COLORS = {
    dash: '#3b6ef0',   // 仪表盘（品牌蓝）
    imp:  '#0e8fa8',   // 导入采集表格（青）
    exp:  '#178a5e',   // 导出交单表格（绿）
    book: '#6b4fe0',   // 数据库管理（紫）
    arch: '#c97a12',   // 数据备份（橙）
    add:  '#4a7fc1',   // 新增设备（蓝）
    mg:   '#6b7d94'    // 管理设备（灰蓝）
  };
  var DEV_COLORS = ['#6b8fd6', '#4fa3ad', '#5aa583', '#9379d6', '#cf9a52', '#bd7a95', '#5f8ecb', '#57a6b8'];
  // 按设备在侧栏里的**顺序**取色（不是按名字哈希）—— 保证相邻两台设备永远不同色
  function devColor(dev) {
    var i = deviceOrder.indexOf(dev);
    if (i < 0) i = 0;
    return DEV_COLORS[i % DEV_COLORS.length];
  }

  // 侧栏一行：图标 + 设备名 + 条数（激活时图标变蓝、文字加粗 —— 见 CSS）。
  // 双击改名 / 拖拽排序已移除，改由「管理设备」页负责删除与排序。
  function devItemHtml(dev, label, cnt) {
    // 只有「数据表」视图才显示激活项 —— 停在导入/导出/管理设备等整页时，
    // 侧栏不该还亮着某个设备（这是个 bug，已修）
    var on = (mainView === 'data' && filterDevice === dev);
    return '<div class="dev-item' + (on ? ' active' : '') + '" data-dev="' + esc(dev) + '" title="单击查看"' +
      ' style="--ac:' + devColor(dev) + '">' +
      ICON.device +
      '<span class="nm">' + esc(label) + '</span><span class="cnt">' + cnt + '</span></div>';
  }

  // 统计：本组人数 / 不在库 / 已分配 / 群组。只统计「未完成」的行（已完成单独在折叠区展示）。
  function vbStatsHtml() {
    var nTotal = 0, nOol = 0, nPend = 0, gset = {};
    rows.forEach(function (r) {
      if (r.device !== filterDevice) return;
      if (r.status === 'done') return;
      nTotal++;
      if (r.status === 'pending') nPend++;
      if (outOfLib(r)) nOol++;
      if (r.group) gset[r.group] = true;
    });
    return '<div class="vb-stats">' +
      '<span class="v-total">本组人数 <b>' + nTotal + '</b></span><span class="sep">·</span>' +
      '<span class="v-ool">不在库 <b>' + nOol + '</b></span><span class="sep">·</span>' +
      '<span class="v-pending">已分配 <b>' + nPend + '</b></span><span class="sep">·</span>' +
      '<span class="v-group">群组 <b>' + Object.keys(gset).length + '</b></span></div>';
  }

  // 操作栏（只有单设备视图了）：一行 —— 已选N + 选中未分配 + 群名输入框 + 搜索定位 + 统计（右端）。
  // 位置在卡片下方，并且吸在窗口底部（见 CSS 的 .view-bar）。
  //
  // ⚠️ 群名框的「✓ 确认」「✕ 取消」两个按钮已按用户要求**全部去掉**，改成**回车执行**：
  //    · 框里**有**名称 → 设为该群名（原「确认」）
  //    · 框里**没**名称 → 把勾选行的群名清掉、退回「未分配」（原「取消」）
  function viewBarHtml() {
    return '<div class="view-bar"><div class="vb-row">' +
      '<span class="vb-sel">已选 <b id="selCount">' + selCount() + '</b></span>' +
      '<button class="vb-btn' + (tailAllSelected() ? ' on' : '') + '" data-act="pickTail" title="自下而上选中 ' + PICK_N +
        ' 个「未分配」（不含不在库 / 已完成），再点一次取消选中">' + ICON.down + '<span>选中未分配</span></button>' +
      '<input id="batchGroup" class="vb-input" placeholder="输入群名称，回车确认" value="' + esc(groupInputVal) +
        '" title="有名称时回车 = 设为「已分配」；留空时回车 = 清空勾选行的群名（退回「未分配」）">' +
      // 搜索定位框：只用来「找人在哪」，不动表格 / 勾选 / 统计
      '<span class="vb-loc" id="locWrap">' +
        '<span class="loc-ico">' + ICON.mag + '</span>' +
        '<input id="vbLocate" class="loc-inp" placeholder="搜索昵称 / ID" autocomplete="off" value="' + esc(locateQ) + '">' +
        '<div class="loc-list" id="locList" hidden></div>' +
      '</span>' +
      '<span class="vb-stats-right">' + vbStatsHtml() + '</span>' +
      '</div></div>';
  }
  // 当前勾选的行，是否就是「自下而上那 PICK_N 条」—— 决定按钮要不要变蓝
  function tailAllSelected() {
    var ks = keysOf(tailPick(filterDevice, PICK_N));
    if (!ks.length) return false;
    return ks.every(function (k) { return selected[k]; });
  }
  // （cancelWarn / cancelTitle 已删除 —— 它们是给「取消」按钮做样式和提示的，
  //   两个按钮去掉后就没有调用方了。现在"空群名 + 有勾选 = 批量删群名"的判定在 submitGroup 里。）

  // 8 列统一列宽（全百分比，合计 100%）：勾选 + 6 文字列 + 删除。
  // table-layout:fixed 只看表头第一行，所以宽度在这里一次性定死。
  // 勾选 / 删除两列只放小图标，配 CSS 收窄内边距后 3% 左右就够，不会出省略号。
  var CW8 = { c: '3.0%', g: '18.0%', n: '24.6%', i: '21.2%', d: '10.0%', t: '10.0%', s: '10.0%', x: '3.2%' };
  function headCheckHtml(dev, keys) {
    var onN = keys.filter(function (k) { return selected[k]; }).length;
    return '<th class="chk" style="width:' + CW8.c + '"><input type="checkbox" data-act="checkAll" data-dev="' + esc(dev) + '"' +
      (keys.length && onN === keys.length ? ' checked' : '') + ' title="全选可操作的数据（不含已完成 / 不在库）"></th>';
  }
  function headDelHtml(dev) {
    return '<th class="col-del" style="width:' + CW8.x + '"><button class="row-del" data-act="delAllVisible" data-dev="' + esc(dev) +
      '" title="删除当前列表全部数据（有确认）">' + ICON.trash + '</button></th>';
  }
  function theadHtml(dev, keys) {
    return '<thead><tr>' + headCheckHtml(dev, keys) +
      '<th style="width:' + CW8.g + '">群名称</th>' +
      '<th style="width:' + CW8.n + '">数据昵称</th>' +
      '<th style="width:' + CW8.i + '">数据ID</th>' +
      '<th style="width:' + CW8.d + '">设备名</th>' +
      '<th style="width:' + CW8.t + '">日期</th>' +
      '<th style="width:' + CW8.s + '">状态</th>' +
      headDelHtml(dev) + '</tr></thead>';
  }

  function groupCard(dev, vis) {
    var showCheck = true;                           // 有勾选列
    var active = vis.filter(function (r) { return r.status !== 'done'; });
    var done = vis.filter(function (r) { return r.status === 'done'; });
    var collapsed = doneCollapsed[dev] !== false;
    // 表头「全选本组」复选框（不含已完成）
    var activeKeys = active.map(function (r) { return r.k; });
    var colN = 8;                                   // 勾选 + 6 文字列 + 删除
    // 卡片头已去掉：统计搬到了操作栏右侧，表格直接从卡片顶部开始（表头那一行自带浅底，视觉上就是头）
    var h = '<div class="group-card" data-dev="' + esc(dev) + '">';
    // 进行中与已完成共用同一张 <table>，列宽天然对齐（已完成折叠靠第二个 <tbody> 的 display:none）
    h += '<table>' + theadHtml(dev, activeKeys);
    h += '<tbody>';
    active.forEach(function (r) { h += rowHtml(r, showCheck); });
    if (!active.length) h += '<tr><td colspan="' + colN + '" style="color:var(--muted);text-align:center">本组暂无数据</td></tr>';
    if (done.length) {
      var doneGset = {};
      done.forEach(function (r) { if (r.group) doneGset[r.group] = true; });
      h += '<tr class="done-divider"><td colspan="' + colN + '"><div class="done-bar">' +
        '<button class="done-toggle" data-act="toggleDone" data-dev="' + esc(dev) + '">' +
        (collapsed ? '▸' : '▾') + ' 已完成（' + done.length + '） · 群组（' + Object.keys(doneGset).length + '） · 点击' + (collapsed ? '展开' : '折叠') +
        '</button>' +
        // 「恢复」放在垃圾桶**左边**：把勾选的已完成数据退回「已分配」
        '<button class="done-act undo" data-act="restoreDone" data-dev="' + esc(dev) +
        '" title="把「勾选」的已完成数据恢复成「已分配」（带撤销）">' + ICON.undo + '</button>' +
        '<button class="done-act del" data-act="delAllDone" data-dev="' + esc(dev) + '" title="删除本组全部已完成数据（有确认）">' + ICON.trash + '</button>' +
        '</div></td></tr>';
    }
    h += '</tbody>';
    if (done.length) {
      h += '<tbody class="done-wrap' + (collapsed ? ' collapsed' : '') + '">';
      done.forEach(function (r) { h += rowHtml(r, showCheck); });
      h += '</tbody>';
    }
    h += '</table></div>';
    return h;
  }

  function emptyGroupCard(dev) {
    return '<div class="group-card" data-dev="' + esc(dev) + '">' +
      '<div class="empty-group">该设备暂无数据，请直接导入该设备的采集文件</div></div>';
  }

  // 全部视图已删除 —— 原来的 allViewCard（多设备合并成一张表）随之去掉。
  // 现在只剩 groupCard 这一个表格构建路径，改动时不会再有「两处要同步改」的负担。

  function rowHtml(r, showCheck) {
    var checked = selected[r.k] ? ' checked' : '';
    var ool = outOfLib(r);
    var bd = badgeOf(r);
    // 「已完成」的行现在**可以勾选**了 —— 用来批量「恢复」回已分配。
    // ⚠️ 只有「不在库」还锁着（outOfLib 对已完成的行本来就返回 false，所以已完成不会被误锁）。
    var locked = ool;
    var h = '<tr class="' + (r.status === 'done' ? 'row-done' : '') + '" data-k="' + esc(r.k) + '">';
    if (showCheck) {
      h += '<td class="chk"><input type="checkbox" data-act="check" data-k="' + esc(r.k) + '"' + checked + (locked ? ' disabled' : '') +
        (ool ? ' title="不在库 · 不可勾选"' : (r.status === 'done' ? ' title="勾上后可点右侧「恢复」退回已分配"' : '')) + '></td>';
    }
    h += '<td class="groupname" data-field="group" data-k="' + esc(r.k) + '" title="' + esc(r.group) + '">' + (r.group ? esc(r.group) : '<span style="color:var(--muted);font-weight:400">—</span>') + '</td>' +
      '<td class="nick" data-field="nick" data-k="' + esc(r.k) + '" title="' + esc(r.nick) + '">' + esc(r.nick) + '</td>' +
      '<td data-field="id" data-k="' + esc(r.k) + '">' + esc(r.id) + '</td>' +
      '<td title="' + esc(r.device) + '">' + esc(r.device) + '</td>' +
      '<td class="date" title="' + esc(r.date) + '">' + esc(shortDate(r.date)) + '</td>' +
      '<td><span class="badge ' + bd.cls + '">' + bd.text + '</span></td>' +
      '<td class="col-del"><button class="row-del" data-act="delRow" data-k="' + esc(r.k) + '" title="删除该条（无确认）">' + ICON.trash + '</button></td></tr>';
    return h;
  }

  // ---------- 双击编辑 ----------
  function startEdit(td) {
    if (td.classList.contains('editing')) return;
    var k = td.getAttribute('data-k'), field = td.getAttribute('data-field');
    var row = findRow(k); if (!row) return;
    // 做到「双击前后零位移」，四个量必须在改动 DOM 之前一次性量好：
    //   rect   → 单元格完整外框（稍后锁到 td.style.width，整列宽度不变）
    //   inner* → 扣掉边框后的整格外框（编辑态单元格 padding 归零，输入框正好铺满）
    //   pad    → 单元格原有内边距（原样交给输入框，文字位置分毫不动）
    var cs = getComputedStyle(td);
    var rect = td.getBoundingClientRect();
    var bL = parseFloat(cs.borderLeftWidth) || 0, bR = parseFloat(cs.borderRightWidth) || 0;
    var bT = parseFloat(cs.borderTopWidth) || 0, bB = parseFloat(cs.borderBottomWidth) || 0;
    var r2 = function (n) { return Math.round(n * 100) / 100; };
    var w = r2(rect.width);
    var innerW = r2(rect.width - bL - bR);
    var innerH = r2(rect.height - bT - bB);
    var pad = cs.paddingTop + ' ' + cs.paddingRight + ' ' + cs.paddingBottom + ' ' + cs.paddingLeft;
    td._old = td.innerHTML;
    td._field = field; td._k = k;
    td.style.width = w + 'px';
    // 防御性解除 max-width：旧版把 max-width 写在 <td> 上时，一旦这里设了明确 width，
    // max-width 会立刻生效并把该列压窄、其余列撑大（曾实测跳动 70px）。
    // 现在列宽由 table-layout:fixed + 表头百分比锁死，这行留作兜底，
    // 防止将来有人再往 <td> 上加 max-width 把固定布局搞乱。
    td.style.maxWidth = 'none';
    td.classList.add('editing');
    td.innerHTML = '<input class="cell-edit" value="' + esc(row[field] || '') + '">';
    var el = td.firstChild;
    el.style.width = innerW + 'px';      // 外框与单元格边界重合
    el.style.height = innerH + 'px';
    el.style.padding = pad;              // 内边距与单元格原值一致 → 文字不缩进、不跳动
    if (el.focus) el.focus();
    if (el.select) { try { el.select(); } catch (e) {} }
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); commitEdit(td); }
      else if (ev.key === 'Escape') { ev.preventDefault(); cancelEdit(td); }
    });
    el.addEventListener('blur', function () { commitEdit(td); });
  }
  function cancelEdit(td) {
    if (!td.classList.contains('editing')) return;
    td.classList.remove('editing');
    td.style.width = '';
    td.style.maxWidth = '';
    td.innerHTML = td._old;
  }
  function commitEdit(td) {
    if (!td.classList.contains('editing')) return;
    var field = td._field, k = td._k;
    var el = td.querySelector('input');
    var val = el ? el.value.trim() : '';
    td.classList.remove('editing');
    td.style.width = '';
    td.style.maxWidth = '';
    var row = findRow(k);
    if (row) applyFieldEdit(row, field, val);
    save(); render();
  }
  function applyFieldEdit(row, field, val) {
    if (field === 'nick') { row.nick = val; }
    else if (field === 'group') {
      row.group = val;
      if (val && row.status === 'none') row.status = 'pending';
      if (!val && row.status === 'pending') row.status = 'none';
    }
    else if (field === 'id') {
      if (!val || val === row.id) return;
      var dup = false;
      rows.forEach(function (x) { if (x !== row && x.id === val) dup = true; });
      if (dup) { toast('数据ID「' + val + '」已存在，未修改'); return; }
      row.id = val;
    }
  }

  // ---------- 删除的撤销 ----------
  // 把被删的行按**原来的索引位置**插回（而不是一股脑堆到末尾）。
  // （旧的 makeUndoInsert / deleteRowsByKeys 已删除：
  //   三个删除入口现在各自内联实现，且都明确「不可撤销」，没有任何调用方）

  // ---------- 批量设群名 / 取消群名 ----------
  // applyGroup(name, keys?)：keys 省略时用「当前勾选」；confirmPick 无勾选时会显式传入自上而下的 N 个。
  function applyGroup(name, keys) {
    name = (name || '').trim();
    if (!name) { toast('请先输入群名称'); return; }
    keys = keys || Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast('请先勾选要操作的人'); return; }
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var snap = [], n = 0, nSkip = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k]) return;
      // 「已完成」不参与改群名（它已经是交完的状态），但**要数出来告诉用户**，
      // 否则会以为按钮没生效 —— 想改就得先点「恢复」
      if (r.status === 'done') { nSkip++; return; }
      if (outOfLib(r)) return;                                            // 不在库 也不参与
      snap.push({ k: r.k, group: r.group, status: r.status });            // 撤销用的完整快照
      r.group = name; r.status = 'pending'; n++;
    });
    if (!n) {
      toast(nSkip ? ('勾选的 ' + nSkip + ' 条都是「已完成」的，要先点「恢复」退回已分配才能改群名')
                  : '选中的行无法设为已分配');
      return;
    }
    selected = {};               // 执行后取消勾选
    save(); render();
    toast('已将 ' + n + ' 人设为「已分配」，群名：' + name +
          (nSkip ? '（另有 ' + nSkip + ' 条已完成被跳过，需先恢复）' : ''), function () {
      snap.forEach(function (s) {
        var r = findRow(s.k);
        if (r) { r.group = s.group; r.status = s.status; }
      });
      save(); render(); toast('已撤销');
    });
  }
  // 「确认」：**只负责给「已勾选」的行加群名** —— 不再自动挑人。
  // 挑人是「选中未分配」按钮的职责，两个入口各干各的，不互相牵连。
  function confirmPick() {
    var name = groupInputVal.trim();
    if (!name) { toast('请先输入群名称'); return; }
    var keys = Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast('请先勾选要操作的人（或用左边的「选中未分配」按钮）'); return; }
    applyGroup(name, keys);
  }
  // 回车 = 群名框的**唯一**执行入口（原来那两个 ✓ / ✕ 按钮已按用户要求去掉）。
  //   · 框里有名称 → 设为该群名
  //   · 框里没名称 → 把勾选行的群名清掉、退回「未分配」
  // 执行完把光标放回输入框，方便连续录入。
  function submitGroup() {
    var hasName = !!groupInputVal.trim();
    var keys = Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast(hasName ? '请先勾选要设群名的人' : '请先勾选要清除群名的人'); return; }
    if (hasName) confirmPick();
    else clearGroup(keys);
    setTimeout(function () { var el = $('batchGroup'); if (el) el.focus(); }, 0);
  }
  // 「选中未分配」：自下而上选中 PICK_N 条「未分配」，再点一次取消。
  // 选完滚到「选中的第一行」，数据多时不用自己往下翻。
  function pickTail() {
    var ks = keysOf(tailPick(filterDevice, PICK_N));
    if (!ks.length) { toast('没有可选的「未分配」数据'); return; }
    var on = ks.every(function (k) { return selected[k]; });
    ks.forEach(function (k) { if (on) delete selected[k]; else selected[k] = true; });
    refreshSelectionUI();          // 已选数 + 按钮变色都在这里面刷新，不重绘整表（避免列表跳动）
    if (!on) {
      var tr = document.querySelector('tr[data-k="' + ks[0] + '"]');
      if (tr && tr.scrollIntoView) { try { tr.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (x) {} }
    }
    toast(on ? ('已取消选中 ' + ks.length + ' 个') : ('已自下而上选中 ' + ks.length + ' 个未分配'));
  }
  // 「恢复」：把**勾选的「已完成」行**退回「已分配」（群名原样保留），带撤销。
  //   · 只有已完成的行会被动到，其他行一律不管（也不会误伤）
  //   · 万一条目没有群名 → 退回「未分配」而不是「已分配」，否则会出现「已分配但没有群名」的自相矛盾状态
  //   · 恢复完把勾选清掉（它们已经换到上面「进行中」区了，留着勾选容易误操作）
  function restoreDone() {
    var keys = Object.keys(selected).filter(function (kk) { return selected[kk]; });
    if (!keys.length) { toast('请先勾选要恢复的数据（已完成的行在下面折叠区里）'); return; }
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var snap = [], n = 0, nPend = 0, nNone = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k] || r.status !== 'done') return;
      snap.push({ k: r.k, group: r.group, status: r.status });     // 先快照再改
      if (r.group) { r.status = 'pending'; nPend++; } else { r.status = 'none'; nNone++; }
      n++;
    });
    if (!n) { toast('勾选的数据里没有「已完成」的 —— 它们要先展开才能勾到'); return; }
    keys.forEach(function (x) { delete selected[x]; });
    save(); render();
    var msg = '已恢复 ' + n + ' 条';
    if (nPend) msg += '为「已分配」';
    if (nNone) msg += (nPend ? '，另有 ' : '') + nNone + ' 条没有群名，退回「未分配」';
    toast(msg, function () {
      snap.forEach(function (s) { var r = findRow(s.k); if (r) { r.group = s.group; r.status = s.status; } });
      save(); render(); toast('已撤销恢复');
    });
  }

  // ==================== 搜索定位（只为「找人在哪」，不动任何数据） ====================
  // 规则：**只搜 数据昵称 / 数据ID**，**包含匹配**（打 1588 能命中 1588559962），忽略大小写。
  //   ⚠️ 按用户要求**不再匹配「群名称」** —— 让行为和输入框提示语完全一致，免得搜了没反应还纳闷。
  // 范围：**所有设备**（搜到别人设备里的人，点一下会自动切过去）。
  // 顺序：按侧栏设备顺序 + 表内顺序 —— 和用户看到的顺序一致。
  function locateFind(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    var ord = {};
    deviceOrder.forEach(function (d, i) { ord[d] = i; });
    var out = rows.filter(function (r) {
      return String(r.nick || '').toLowerCase().indexOf(q) !== -1 ||
             String(r.id || '').toLowerCase().indexOf(q) !== -1;
    });
    // Array.sort 在现代 V8 里是稳定的 → 同设备内保持原顺序
    return out.sort(function (a, b) {
      var ia = (a.device in ord) ? ord[a.device] : 1e9;
      var ib = (b.device in ord) ? ord[b.device] : 1e9;
      return ia - ib;
    });
  }
  var LOC_MAX = 3;            // 列表最多显示 3 条
  // 只重绘「下拉列表」这一小块 —— 绝不碰主区，所以输入框的焦点和光标永远不会丢
  function locateRender() {
    var box = $('locList');
    if (!box) return;
    var q = locateQ.trim();
    if (!q) { box.hidden = true; box.innerHTML = ''; locateIdx = 0; return; }
    var ms = locateFind(q);
    if (!ms.length) {
      box.innerHTML = '<div class="loc-none">没有找到「' + esc(q) + '」</div>';
      box.hidden = false;
      locateIdx = 0;
      return;
    }
    if (locateIdx >= Math.min(ms.length, LOC_MAX)) locateIdx = 0;
    box.innerHTML = ms.slice(0, LOC_MAX).map(function (r, i) {
      return '<div class="loc-item' + (i === locateIdx ? ' active' : '') + '" data-act="locateGo" data-k="' + esc(r.k) + '">' +
        '<span class="loc-nick">' + esc(r.nick) + '</span>' +
        '<span class="loc-id">' + esc(r.id) + '</span>' +
        '</div>';
    }).join('');
    box.hidden = false;
  }
  // 键盘 ↑↓ 只挪「高亮项」，不重建列表
  function locateMove(step) {
    var box = $('locList');
    if (!box || box.hidden) return;
    var n = box.querySelectorAll('.loc-item').length;
    if (!n) return;
    locateIdx = (locateIdx + step + n) % n;
    var items = box.querySelectorAll('.loc-item');
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', i === locateIdx);
  }
  // 关闭列表 = 输入框也清空（按用户要求）
  function locateClose() {
    locateQ = '';
    locateIdx = 0;
    var box = $('locList');
    if (box) { box.hidden = true; box.innerHTML = ''; }
    var inp = $('vbLocate');
    if (inp && inp.value) inp.value = '';
  }
  // 点某一条 → 跳过去
  function locateGo(k) {
    var r = findRow(k);
    locateClose();                     // 先关列表 + 清空输入（下面 render 会按空值重建）
    if (!r) { render(); return; }
    var dev = r.device;
    if (dev !== filterDevice) {
      filterDevice = dev;              // 目标是别的设备 → 切过去
      selected = {};
      groupInputVal = '';
    }
    // 目标在「已完成」折叠区里 → **自动展开**，否则跳过去也看不见那行（display:none）
    // ⚠️ 这句必须放在最后：切设备的默认行为是把已完成折叠起来，这里要覆盖它
    if (r.status === 'done') doneCollapsed[dev] = false;
    mainView = 'data';
    saveUI();
    render();
    var tr = document.querySelector('tr[data-k="' + k + '"]');
    if (tr) {
      tr.scrollIntoView({ block: 'center', behavior: 'smooth' });   // 居中：滚到底会被吸底操作栏挡住
      tr.classList.add('loc-hit');
      if (locHitTm) clearTimeout(locHitTm);
      locHitTm = setTimeout(function () { tr.classList.remove('loc-hit'); }, 3000);
    } else {
      toast('这条数据暂时看不到（可能被别的条件挡住了）');
    }
  }

  // （原 cancelPick 已删除 —— 它是「✕ 取消」按钮的处理函数。
  //   按钮去掉后，它的三种含义合并进了 submitGroup：空群名时直接走 clearGroup。）

  // 批量删除群名：勾选行里凡是「有群名且未完成」的，group 清空、status 退回 none。带撤销。
  // 「已完成」的行不动（要退群名得先「恢复」），但会数出来告诉用户。
  function clearGroup(keys) {
    var inKeys = {}; keys.forEach(function (x) { inKeys[x] = true; });
    var snap = [], n = 0, nSkip = 0;
    rows.forEach(function (r) {
      if (!inKeys[r.k]) return;
      if (r.status === 'done') { nSkip++; return; }     // 已完成不参与
      if (outOfLib(r) || !r.group) return;
      snap.push({ k: r.k, group: r.group, status: r.status });   // 先快照，再改
      r.group = ''; r.status = 'none'; n++;
    });
    // ⚠️ 不管有没有删到东西，勾选和输入框都要清掉 —— 用户点的是「取消」，
    // 总得能退出当前选择状态。之前这里没删到东西就 return，导致「取消」按了没反应。
    selected = {}; groupInputVal = '';
    if (!n) {
      render();
      toast(nSkip ? ('勾选的 ' + nSkip + ' 条是「已完成」的，要先点「恢复」才能退群名')
                  : '勾选的数据本来就没有群名');
      return;
    }
    save(); render();
    toast('已删除 ' + n + ' 条的群名，退回「未分配」' + (nSkip ? '（另有 ' + nSkip + ' 条已完成被跳过）' : ''), function () {
      snap.forEach(function (s) {
        var r = findRow(s.k);
        if (r) { r.group = s.group; r.status = s.status; }
      });
      save(); render(); toast('已撤销');
    });
  }

  // ---------- 事件委托 ----------
  document.addEventListener('click', function (e) {
    if (e.target.closest('input,select')) return;   // 输入框/复选框交给各自事件
    var t = e.target.closest('[data-act],.dev-item');
    if (!t) return;

    if (t.classList.contains('dev-item')) {
      var dv = t.getAttribute('data-dev');
      var changed = (filterDevice !== dv);
      var leavingPage = (mainView !== 'data');
      if (changed) {
        filterDevice = dv;
        selected = {};          // 切换设备/全部视图时清空选中
        groupInputVal = '';     // 同时清空群名输入框，避免误带到别的设备
        locateClose();          // 搜索定位框也清空（避免带着旧词换设备）
      }
      // 切换页/切换设备时，把目标设备的「已完成」折叠起来（保持列表清爽）
      if (changed || leavingPage) doneCollapsed[dv] = true;
      // 点设备名总是回到数据表（可能当前正停在导入/导出/库管理整页）
      if (changed || leavingPage) { mainView = 'data'; saveUI(); render(); }
      return;
    }

    var act = t.getAttribute('data-act'), dev = t.getAttribute('data-dev'), k = t.getAttribute('data-k');
    // ---- 侧栏底部的三个全局操作：改为主区整页视图（不再弹窗）----
    if (act === 'openImport') { pendingFiles = []; mainView = 'import'; render(); return; }
    // ---- 导入页：移除单个文件 / 取消全部 / 确定导入 ----
    if (act === 'impRemove') { pendingFiles.splice(+t.getAttribute('data-i'), 1); render(); return; }
    if (act === 'impClear') { pendingFiles = []; render(); toast('已清空待导入列表'); return; }
    if (act === 'impGo') {
      if (!pendingFiles.length) { toast('还没有选择文件'); return; }
      var fs = pendingFiles.slice();       // 先拷一份：importFiles 是异步的
      pendingFiles = [];
      importFiles(fs);                     // importFiles 完成后会把 mainView 切回 data 并 render
      return;
    }
    if (act === 'openExport') { mainView = 'export'; render(); return; }
    if (act === 'openRoster') { mainView = 'roster'; render(); return; }
    // ---- 仪表盘 ----
    if (act === 'openDash') { mainView = 'dash'; render(); return; }
    if (act === 'dashGo') { dashGo2(t.getAttribute('data-k')); return; }
    // ---- 数据备份页：导出 / 选备份文件恢复 ----
    if (act === 'openBackup') { mainView = 'backup'; render(); return; }
    if (act === 'bkExport') { bkExport(); return; }
    if (act === 'bkPick') { var bf = $('backupFile'); if (bf) bf.click(); return; }
    if (act === 'openManage') { mainView = 'manage'; render(); return; }
    if (act === 'openAddDev') { newDevVal = ''; mainView = 'addDev'; render(); return; }
    if (act === 'addDevOk') { addDevOk(); return; }
    if (act === 'toggleDevList') { devListCollapsed = !devListCollapsed; saveUI(); render(); return; }
    if (act === 'doExport') {
      var expTargets = exportTargets();
      if (!expTargets.length) { toast('还没有可导出的数据：先勾选数据 → 输入群名 → 点 ✓ 确认'); return; }
      mainView = 'data'; doExport(expTargets); return;
    }
    // ---- 管理设备整页：改名 / 删除（排序走拖拽，见下方 drag 委托）----
    if (act === 'renameDev') {
      var rd = t.getAttribute('data-dev');
      openModal({
        title: '修改设备名称',
        bodyHtml: '<div class="muted">给设备「' + esc(rd) + '」改一个新名称，该设备下的数据会一并跟着改。</div>',
        input: { placeholder: '新的设备名称', value: rd },
        okText: '保存',
        onOk: function (val) { renameDevice(rd, val); }
      });
      return;
    }
    if (act === 'delDev') {
      // 删除设备 = 连同其下数据一起永久删除（按用户要求不提供撤销、不弹提示条）
      var dd = t.getAttribute('data-dev');
      var goneKeys = {};
      rows.forEach(function (r) { if (r.device === dd) goneKeys[r.k] = true; });
      rows = rows.filter(function (r) { return r.device !== dd; });
      for (var gk in goneKeys) delete selected[gk];
      deviceOrder = deviceOrder.filter(function (x) { return x !== dd; });
      delete devManual[dd];
      delete doneCollapsed[dd];
      if (filterDevice === dd) filterDevice = deviceOrder[0] || '';   // 删掉的正是当前设备 → 退回第一个
      save(); render();
      return;
    }
    // ---- 库管理整页 ----
    if (act === 'rsMode') {
      setRosterMode(t.getAttribute('data-mode')).then(function () {
        refreshRosterModal();
        if (ROSTER_MODE === 'cloud') {
          toast('正在检查云端名单库…');
          cloudSync().then(function (r) {
            refreshRosterModal();
            toast(r && r.updated ? ('云端名单库已更新：' + r.count.toLocaleString() + ' 条（' + r.ms + 'ms）')
                                 : '云端名单库已是最新');
          });
        } else if (ROSTER_MODE === 'local') {
          toast('已切到「本地上传名单库」，点「选择文件…」导入');
        } else {
          toast('已关闭「在库」检测');
        }
      });
      return;
    }
    if (act === 'rsPick') { pickRosterFile(); return; }
    if (act === 'rsClear') { clearRoster(); return; }
    if (act === 'toggleDone') { doneCollapsed[dev] = doneCollapsed[dev] === false; render(); }
    // 注：confirmPick / cancelPick 原来挂在这两个按钮上，按钮已按用户要求去掉，
    //     现在统一由群名框的**回车**触发 submitGroup（见下方 keydown）。
    else if (act === 'pickTail') { pickTail(); }
    else if (act === 'restoreDone') { restoreDone(); }
    else if (act === 'locateGo') { locateGo(t.getAttribute('data-k')); }
    else if (act === 'delRow') {
      // 单条删除：静默、不可撤销（按用户要求不弹任何提示）
      var rk = t.getAttribute('data-k');
      rows = rows.filter(function (r) { return r.k !== rk; });
      delete selected[rk];
      save(); render();
    }
    else if (act === 'delAllVisible') {
      // 表头垃圾桶：删除当前列表全部「未完成」数据（不含已完成），先弹确认（有提示）
      var scopeList = rows.filter(function (r) { return r.device === dev && r.status !== 'done' && matchFilters(r); });
      if (!scopeList.length) { toast('当前列表没有可删除的数据'); return; }
      var nN = scopeList.length;
      openModal({
        title: '删除全部',
        bodyHtml: '将删除当前列表中的 <b class="n">' + nN + '</b> 条数据，<b>此操作不可撤销</b>。确定继续吗？',
        okText: '全部删除', okRed: true,
        onOk: function () {
          var delKeys = {};
          scopeList.forEach(function (r) { delKeys[r.k] = true; });
          rows = rows.filter(function (r) { return !delKeys[r.k]; });
          for (var kk in delKeys) delete selected[kk];
          save(); render();
        }
      });
    }
    else if (act === 'delAllDone') {
      // 已完成区垃圾桶：删除本组「全部已完成」数据（与表头垃圾桶同逻辑：有确认），只对已完成有效
      var dlist = doneRowsOfDev(dev);
      if (!dlist.length) { toast('本组没有已完成数据'); return; }
      var dn = dlist.length;
      openModal({
        title: '删除全部已完成',
        bodyHtml: '将删除本组 <b class="n">' + dn + '</b> 条已完成数据，<b>此操作不可撤销</b>。确定继续吗？',
        okText: '全部删除', okRed: true,
        onOk: function () {
          var dk = {};
          dlist.forEach(function (r) { dk[r.k] = true; });
          rows = rows.filter(function (r) { return !dk[r.k]; });
          for (var k2 in dk) delete selected[k2];
          save(); render();
        }
      });
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-act="check"]')) {
      var k = t.getAttribute('data-k');
      if (t.checked) selected[k] = true; else delete selected[k];
      refreshSelectionUI();
    } else if (t.matches('input[data-act="checkAll"]')) {
      var dev = t.getAttribute('data-dev');
      var on = t.checked;
      rows.forEach(function (r) {                  // 只作用于「可操作」的行（不含已完成 / 不在库）
        if (r.device !== dev || r.status === 'done' || outOfLib(r)) return;
        if (on) selected[r.k] = true; else delete selected[r.k];
      });
      refreshSelectionUI();
    }
  });

  // 两个输入框实时记住内容（操作栏 / 新增设备页都会重绘，避免输入内容丢失）。
  // 群名框还要顺带刷新两个图标按钮的状态（确认是否点亮、取消是「清空」还是「删群名」）。
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || !t.id) return;
    if (t.id === 'newDevName') { newDevVal = t.value; return; }
    // 搜索定位：只重绘下拉列表，**不重绘主区** —— 否则输入框会丢焦点、光标会跳
    if (t.id === 'vbLocate') { locateQ = t.value; locateIdx = 0; locateRender(); return; }
    // 仪表盘的大搜索框：同一套逻辑，也是只重绘它自己的结果列表
    if (t.id === 'dashSearch') { dashQ = t.value; dashIdx = 0; dashLocRender(); return; }
    if (t.id !== 'batchGroup') return;
    groupInputVal = t.value;      // 只管记值；执行靠回车（见 submitGroup）
  });
  document.addEventListener('keydown', function (e) {
    if ($('modalMask').classList.contains('show')) return;   // 弹窗打开时，回车交给弹窗处理，不再触发群名确认
    if (e.target && e.target.id === 'newDevName' && e.key === 'Enter') {
      e.preventDefault();
      addDevOk();
      return;
    }
    if (e.target && e.target.id === 'batchGroup' && e.key === 'Enter') {
      e.preventDefault();
      submitGroup();      // 有名称→设群名；无名称→清群名退回「未分配」
      return;
    }
    // 仪表盘大搜索框：↑↓ 选项 / 回车跳转 / Esc 关闭（和操作栏那套一致）
    if (e.target && e.target.id === 'dashSearch') {
      if (e.key === 'Escape') { e.preventDefault(); dashLocClose(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); dashLocMove(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); dashLocMove(-1); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        var dbox = $('dashList');
        if (dbox && !dbox.hidden) {
          var dit = dbox.querySelector('.bs-item.active') || dbox.querySelector('.bs-item');
          if (dit) dashGo2(dit.getAttribute('data-k'));
        }
      }
      return;
    }
    // 搜索定位框的键盘操作：↑↓ 选项 / 回车跳转 / Esc 关闭（关闭时输入框一并清空）
    if (e.target && e.target.id === 'vbLocate') {
      if (e.key === 'Escape') { e.preventDefault(); locateClose(); return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); locateMove(1); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); locateMove(-1); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        var lbox = $('locList');
        if (lbox && !lbox.hidden) {
          var lit = lbox.querySelector('.loc-item.active') || lbox.querySelector('.loc-item');
          if (lit) locateGo(lit.getAttribute('data-k'));
        }
      }
    }
  });
  // 点空白处 → 关掉定位列表 / 仪表盘搜索结果（输入框一并清空）
  document.addEventListener('mousedown', function (e) {
    var el = e.target, hit = function (sel) { return el && el.closest && el.closest(sel); };
    var box = $('locList');
    if (box && !box.hidden && !hit('#locWrap')) locateClose();       // 操作栏里的定位列表
    var dbox = $('dashList');
    if (dbox && !dbox.hidden && !hit('#dashWrap')) dashLocClose();   // 仪表盘的大搜索
  });

  document.addEventListener('dblclick', function (e) {
    if (e.target.closest('input,button,select')) return;
    var td = e.target.closest('td[data-field]');
    if (td) startEdit(td);
  });

  // ---------- 拖拽 ----------
  // ① 管理设备页：拖动 .mg-row 调整 deviceOrder 顺序；
  // ② 兜底：外部文件拖到页面空白处时阻止浏览器直接打开该文件。
  function isFileDrag(e) {
    var ty = e.dataTransfer && e.dataTransfer.types;
    return !!ty && Array.prototype.indexOf.call(ty, 'Files') !== -1;   // 外部文件拖拽（导入）
  }
  var mgDrag = null;
  function clearMgOver() {
    var els = document.querySelectorAll('.mg-row.drag-over');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('drag-over');
  }
  document.addEventListener('dragstart', function (e) {
    if (e.target.closest && e.target.closest('button')) return;   // 按钮上不发起行拖拽
    var row = e.target.closest ? e.target.closest('.mg-row[draggable="true"]') : null;
    if (!row) return;
    mgDrag = row.getAttribute('data-dev');
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', 'mg'); } catch (x) {}
  });
  document.addEventListener('dragover', function (e) {
    if (mgDrag) {
      var row = e.target.closest('.mg-row[draggable="true"]');
      if (row && row.getAttribute('data-dev') !== mgDrag) {
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        clearMgOver(); row.classList.add('drag-over');
      }
      return;
    }
    if (isFileDrag(e)) e.preventDefault();
  });
  document.addEventListener('drop', function (e) {
    if (mgDrag) {
      var row = e.target.closest('.mg-row[draggable="true"]');
      clearMgOver();
      if (row) {
        var to = row.getAttribute('data-dev');
        if (to !== mgDrag) {
          e.preventDefault();
          var from = deviceOrder.indexOf(mgDrag);
          if (from !== -1) {
            deviceOrder.splice(from, 1);
            var ti = deviceOrder.indexOf(to);
            deviceOrder.splice(ti, 0, mgDrag);
            save(); render(); toast('已调整分组顺序');
          }
        }
      }
      mgDrag = null;
      return;
    }
    if (isFileDrag(e)) e.preventDefault();
  });
  document.addEventListener('dragend', function () {
    mgDrag = null; clearMgOver();
    var els = document.querySelectorAll('.mg-row.dragging');
    for (var i = 0; i < els.length; i++) els[i].classList.remove('dragging');
  });

  // ---------- 主区整页视图（导入 / 导出 / 库管理）----------
  // 页面头部只有标题（返回按钮已按要求去掉）；回数据表靠点侧栏设备名 / 全部。
  function pageHead(title) {
    return '<div class="page-head"><span class="page-title">' + esc(title) + '</span></div>';
  }
  // 导入页：**先把文件攒起来，点「确定导入」才真的导**。
  // 以前是拖进来/选完立刻导入，多选文件时会一个个往里进，想反悔都来不及。
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(1) + ' MB';
  }
  var pendingFiles = [];      // 待导入的文件（File 对象数组）

  // 导入页每次重绘后都要重新挂监听（主区会被 innerHTML 整个换掉）
  function wireImportPage() {

      e.preventDefault(); e.stopPropagation();

        addPendingFiles(e.dataTransfer.files);      // 只攒着，不导入
      }
    });
  }
  function exportPageHtml() {

    } else {

  function rosterPageHtml() {

  // 管理设备页：整组改名（原「双击侧栏改名」已移除，改在这里用弹窗完成）
  function renameDevice(old, val) {
    val = (val || '').trim();
    if (!val || val === old) { render(); return; }
    if (deviceOrder.indexOf(val) !== -1) { toast('已存在同名设备：' + val); render(); return; }
    var di = deviceOrder.indexOf(old);
    if (di !== -1) deviceOrder[di] = val;
    if (devManual[old]) { delete devManual[old]; devManual[val] = true; }
    if (doneCollapsed[old] !== undefined) { doneCollapsed[val] = doneCollapsed[old]; delete doneCollapsed[old]; }
    rows.forEach(function (r) { if (r.device === old) r.device = val; });
    if (filterDevice === old) filterDevice = val;

  // ==================== 仪表盘（大搜索框 + 统计栏） ====================
  // 统计口径（2026-10-12 按牛牛要求定稿）：
  //   · 「全部人数」= **不含已完成**（已交单的不算待办）→ 只数 pending + none
  //   · 不在库 / 已分配：照旧
  //   · 「待完成群组 / 已完成群组」= 按**群名去重**；一个群里只要还有一条没完成 → 待完成
  //   · 悬停：前三个显示「每台设备的数量」，后两个显示「**群名 + 对应设备名**」
  function dashStats2() {
    var A = { total: 0, ool: 0, pend: 0 };
    var devTot = {}, devOol = {}, devPend = {}, gmap = {};
    rows.forEach(function (r) {
      var undone = (r.status !== 'done');
      if (undone) {                       // 「全部人数」不含已完成
        A.total++;
        devTot[r.device] = (devTot[r.device] || 0) + 1;
      }
      if (outOfLib(r)) { A.ool++; devOol[r.device] = (devOol[r.device] || 0) + 1; }
      if (r.status === 'pending') { A.pend++; devPend[r.device] = (devPend[r.device] || 0) + 1; }
      if (r.group) {
        var g = gmap[r.group] || (gmap[r.group] = { fin: true, devs: {}, total: 0, undone: 0 });
        g.total++;
        if (r.status !== 'done') { g.fin = false; g.undone++; }
        g.devs[r.device] = true;
      }
    });
    var gPend = [], gDone = [];
    Object.keys(gmap).forEach(function (g) {
      var devs = Object.keys(gmap[g].devs);
      devs.sort(function (a, b) { return deviceOrder.indexOf(a) - deviceOrder.indexOf(b); });   // 按侧栏顺序
      (gmap[g].fin ? gDone : gPend).push({ g: g, devs: devs, total: gmap[g].total, undone: gmap[g].undone });
    });
    // ⚠️ 别用 localeCompare(.., 'zh') 拼音排序 —— 无头浏览器没有中文排序数据，结果不可靠 ✗
    //    改成**有意义的确定排序**：待完成按「还欠多少人」多的在前，已完成按「总人数」多的在前
    gPend.sort(function (a, b) { return (b.undone - a.undone) || (b.total - a.total) || (a.g < b.g ? -1 : 1); });
    gDone.sort(function (a, b) { return (b.total - a.total) || (a.g < b.g ? -1 : 1); });
    return { A: A, devTot: devTot, devOol: devOol, devPend: devPend,
             nGP: gPend.length, nGD: gDone.length, gPend: gPend, gDone: gDone };
  }
  // 前三个统计的悬停卡片：每台设备 + 数量
  function popNumHtml(map, unit) {
    var ds = deviceOrder.filter(function (d) { return (map[d] || 0) > 0; });
    if (!ds.length) return '<div class="pr"><span>暂无</span></div>';
    return ds.map(function (d) {
      return '<div class="pr"><span>' + esc(d) + '</span><b>' + (map[d] || 0).toLocaleString() + (unit || '') + '</b></div>';
    }).join('');
  }
  // 群组统计的悬停卡片：**群名 + 对应设备名**（群跨设备就用「、」连起来）
  var POP_GROUP_MAX = 12;
  function popGroupHtml(list) {
    if (!list.length) return '<div class="pr"><span>暂无</span></div>';
    var show = list.slice(0, POP_GROUP_MAX);
    var h = show.map(function (x) {
      return '<div class="pr"><span class="gn" title="' + esc(x.g) + '">' + esc(x.g) + '</span>' +
        '<b class="gd" title="' + esc(x.devs.join('、')) + '">' + esc(x.devs.join('、')) + '</b></div>';
    }).join('');
    if (list.length > POP_GROUP_MAX) h += '<div class="pnote">还有 ' + (list.length - POP_GROUP_MAX) + ' 个群…</div>';
    return h;
  }
  function dashStatHtml(cls, label, val, pop, zeroGray) {
    return '<div class="dstat ' + cls + (zeroGray && !val ? ' zero' : '') + '">' +
      '<div class="dv">' + val.toLocaleString() + '</div>' +
      '<div class="dl">' + label + '</div>' +
      '<div class="pop">' + pop + '</div></div>';
  }
  function dashPage2Html() {
    var s = dashStats2(), A = s.A;
    return '<div class="dash2"><div class="inner">' +
      // ---- 大搜索框 ----
      '<div class="big-search" id="dashWrap">' +
        '<div class="row">' +
          '<span class="bs-ico">' + ICON.mag + '</span>' +
          '<input id="dashSearch" class="bs-inp" placeholder="搜索数据昵称 / 数据ID" autocomplete="off" value="' + esc(dashQ) + '">' +
        '</div>' +
        '<div class="bar"></div>' +
        '<div class="bs-list" id="dashList" hidden></div>' +
      '</div>' +
      // ---- 统计栏 ----
      '<div class="dash-stats">' +
        dashStatHtml('s-total', '全部人数', A.total, popNumHtml(s.devTot, ' 条')) +
        dashStatHtml('s-ool', '不在库', A.ool, popNumHtml(s.devOol, ' 条'), true) +
        dashStatHtml('s-pend', '已分配', A.pend, popNumHtml(s.devPend, ' 条')) +
        dashStatHtml('s-gpend', '待完成群组', s.nGP, popGroupHtml(s.gPend)) +
        dashStatHtml('s-gdone', '已完成群组', s.nGD, popGroupHtml(s.gDone)) +
      '</div>' +
      '</div></div>';
  }

  // 仪表盘大搜索：逻辑和单设备操作栏那套**完全一致**（跨设备 / 包含匹配 / 点击跳转）
  var dashQ = '';
  var dashIdx = 0;
  function dashLocRender() {
    var box = $('dashList');
    if (!box) return;
    var q = dashQ.trim();
    if (!q) { box.hidden = true; box.innerHTML = ''; dashIdx = 0; return; }
    var ms = locateFind(q);
    if (!ms.length) {
      box.innerHTML = '<div class="bs-none">没有找到「' + esc(q) + '」</div>';
      box.hidden = false; dashIdx = 0; return;
    }
    if (dashIdx >= Math.min(ms.length, LOC_MAX)) dashIdx = 0;
    box.innerHTML = ms.slice(0, LOC_MAX).map(function (r, i) {
      return '<div class="bs-item' + (i === dashIdx ? ' active' : '') + '" data-act="dashGo" data-k="' + esc(r.k) + '">' +
        '<span class="bn">' + esc(r.nick) + '</span>' +
        '<span class="bi">' + esc(r.id) + '</span></div>';
    }).join('');
    box.hidden = false;
  }
  function dashLocMove(step) {
    var box = $('dashList');
    if (!box || box.hidden) return;
    var items = box.querySelectorAll('.bs-item');
    if (!items.length) return;
    dashIdx = (dashIdx + step + items.length) % items.length;
    for (var i = 0; i < items.length; i++) items[i].classList.toggle('active', i === dashIdx);
  }
  function dashLocClose() {
    dashQ = ''; dashIdx = 0;
    var box = $('dashList'); if (box) { box.hidden = true; box.innerHTML = ''; }
    var inp = $('dashSearch'); if (inp && inp.value) inp.value = '';
  }
  // 点一条 → 直接复用操作栏那套跳转（切设备 → 展开已完成 → 居中滚动 → 高亮）
  function dashGo2(k) {

  }

  // ---------- 数据备份 / 恢复 ----------
  // 用途：换电脑 / 重装 / 从浏览器搬到桌面版。导出一个 JSON，另一端导进去。
  // ⚠️ 不含 40 万条名单库缓存（太大），换机器后联网会自动重新下载，不影响使用。
  function bkSnapshot() {
    return {
      app: '拉群小助手', kind: 'backup', v: 1, at: new Date().toISOString(),
      data: {
        rows: rows,
        deviceOrder: deviceOrder,
        devManual: devManual,
        ui: { doneCollapsed: doneCollapsed, devListCollapsed: devListCollapsed },
        rosterMode: ROSTER_MODE
      }
    };
  }
  function bkExport() {
    var blob = new Blob([JSON.stringify(bkSnapshot())], { type: 'application/json' });
    var d = new Date();
    var fname = '拉群小助手_备份_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json';
    downloadBlob(blob, fname);
    toast('已导出备份：' + rows.length.toLocaleString() + ' 条数据 · ' + deviceOrder.length + ' 个设备');
  }
  function backupPageHtml() {
    var nDone = rows.filter(function (r) { return r.status === 'done'; }).length;
    return '<div class="page-wrap"><div class="page-card">' + pageHead('数据备份') +
      '<div class="page-body">' +
      '<p>把所有数据打包成一个文件，换电脑、重装、或从浏览器搬到桌面版时用得上。</p>' +
      '<p class="muted">当前：<b class="n">' + rows.length.toLocaleString() + '</b> 条数据 · <b class="n">' +
        deviceOrder.length + '</b> 个设备 · <b class="n">' + nDone.toLocaleString() + '</b> 条已完成</p>' +
      '<div style="margin-top:20px"><button class="btn primary btn-ico" data-act="bkExport">' +
        ICON.arch + '<span>导出备份文件</span></button></div>' +
      '<div class="bk-sep"></div>' +
      '<p class="muted">从备份文件恢复：<b>会覆盖当前全部数据</b>。恢复后 6 秒内可以点提示条上的「撤销」退回，' +
        '所以就算导错文件也不会丢东西。</p>' +
      '<div style="margin-top:14px"><button class="btn btn-ico" data-act="bkPick">' +
        ICON.imp + '<span>选择备份文件…</span></button></div>' +
      '</div></div></div>';
  }
  function onBackupFileChosen(files) {
    if (!files || !files.length) return;
    var reader = new FileReader();
    reader.onload = function () {
      var snap;
      try { snap = JSON.parse(reader.result); } catch (e) { toast('这个文件打不开（不是有效的备份文件）'); return; }
      if (!snap || snap.kind !== 'backup' || !snap.data || !Array.isArray(snap.data.rows)) {
        toast('这个文件不是「拉群小助手」的备份'); return;
      }
      var d = snap.data;
      var n = (d.rows || []).length, dn = (d.deviceOrder || []).length;
      var when = snap.at ? String(snap.at).replace('T', ' ').replace(/\..*$/, '') : '未知';
      openModal({
        title: '从备份恢复',
        bodyHtml: '将用这个备份<b>替换掉当前的全部数据</b>。<br><br>' +
          '备份内容：<b class="n">' + n.toLocaleString() + '</b> 条数据 · <b class="n">' + dn + '</b> 个设备<br>' +
          '备份时间：' + esc(when) + '<br><br>' +
          '<span style="color:var(--red)">恢复后 6 秒内可点提示条上的「撤销」退回。</span>',
        okText: '确定恢复', okRed: true,
        onOk: function () { doRestore(snap); }
      });
    };
    reader.readAsText(files[0], 'utf-8');
  }
  function doRestore(snap) {
    var before = bkSnapshot();          // 先把当前数据整份留下来，供撤销
    var d = snap.data;
    rows = d.rows || [];
    deviceOrder = d.deviceOrder || [];
    devManual = d.devManual || {};
    var u = d.ui || {};
    doneCollapsed = u.doneCollapsed || {};
    devListCollapsed = !!u.devListCollapsed;
    selected = {}; groupInputVal = ''; newDevVal = ''; pendingFiles = [];
    // 补/校正行内键 k，并把 uid 抬到最大，避免之后新增的行撞号
    rows.forEach(function (r) {
      if (!r.k) { r.k = 'r' + (++uid); return; }
      var n2 = parseInt(String(r.k).slice(1), 10);
      if (!isNaN(n2) && n2 > uid) uid = n2;
    });
    filterDevice = deviceOrder[0] || '';
    mainView = 'data';
    save();
    if (d.rosterMode && ROSTER_MODES.indexOf(d.rosterMode) !== -1) {
      try { setRosterMode(d.rosterMode); } catch (e) {}
    }
    render();
    toast('已恢复 ' + rows.length.toLocaleString() + ' 条数据 · ' + deviceOrder.length + ' 个设备', function () {
      var b = before.data;                       // 撤销：把恢复前那一份写回去
      rows = b.rows; deviceOrder = b.deviceOrder; devManual = b.devManual;
      doneCollapsed = (b.ui || {}).doneCollapsed || {};
      devListCollapsed = !!(b.ui || {}).devListCollapsed;
      selected = {}; filterDevice = deviceOrder[0] || '';
      save(); render(); toast('已撤销恢复');
    });
  }

  // ---------- 导入弹窗里的那套已删除 ----------
  // 导入现在是「导入采集表格」整页：先把文件攒在列表里、可逐个 × 掉，点「确定导入」才真的导。
  // 见 importPageHtml / wireImportPage / addPendingFiles。

  // 弹窗：点遮罩关闭 + 按钮处理
  $('modalMask').addEventListener('click', function (e) {
    if (e.target === this) { closeModal(); return; }
    var b = e.target.closest('[data-modal]');
    if (!b) return;
    if (b.getAttribute('data-modal') === 'ok') confirmModal(); else closeModal();
  });
  // 弹窗键盘：Esc = 取消，回车 = 确定（无「确定」按钮的弹窗回车无效；输入型弹窗为空时不关闭）
  document.addEventListener('keydown', function (e) {
    if (!$('modalMask').classList.contains('show')) return;
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    else if (e.key === 'Enter' && modalHasOk) { e.preventDefault(); confirmModal(); }
  });

  // ---------- 静态元素的事件 ----------
  // 只有这两个隐藏的文件选择框是静态的；侧栏那三个按钮和搜索框都在会被重绘的区域里，
  // 所以它们的事件写在上面的事件委托里（直接绑定第一次重绘后就会失效）。
  $('fileInput').addEventListener('change', function () {
    // 只把文件攒到导入页的列表里，等用户点「确定导入」才真的导
    if (this.files.length) { mainView = 'import'; addPendingFiles(this.files); }
    this.value = '';
  });
  $('rosterFile').addEventListener('change', function () {
    if (this.files.length) onRosterFileChosen(this.files);
    this.value = '';
  });
  $('backupFile').addEventListener('change', function () {
    if (this.files.length) onBackupFileChosen(this.files);
    this.value = '';
  });
  load();
  render();
  // 名单库：先读本机缓存立刻可用（断网也行），云端再在后台比对版本号
  initRoster().then(function () {
    if (rosterSet.size) render();                       // 缓存命中 → 立刻把红标补上
    else if (ROSTER_MODE === 'cloud') toast('正在获取云端名单库…');
    return cloudSync();
  }).then(function (r) {
    if (r && r.updated) {
      render();
      // 名单库是后台下载的，完成时间不可预测（几秒到几十秒）。
      // 如果此刻正有一条「撤销」提示挂着，千万别顶掉它 —— 用户可能正要按。
      // 这条只是通知性质，静默丢掉没有损失。
      if ($('toastUndo').hidden) toast('云端名单库已就绪：' + r.count.toLocaleString() + ' 条（用时 ' + r.ms + 'ms）');
    }
  }).catch(function () { /* 拉不到就静默用缓存，不打扰用户 */ });
})();
</script>
</body>
</html>
